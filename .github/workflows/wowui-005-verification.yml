name: WOWUI-005 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wowui-005-verification.yml"

jobs:
  verify-gear:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Gear source contract and syntax
        run: |
          node --check mockup/gear.js
          grep -q 'armory-list armory-grid' mockup/gear.html
          grep -q 'heroClassIcon' mockup/gear.html
          grep -q 'wow-select' mockup/gear.html
          grep -q 'wow-input' mockup/gear.html
          grep -q 'wow-checkbox' mockup/gear.html
          grep -q 'Primary ·' mockup/gear.js
          grep -q 'Secondary ·' mockup/gear.js
          grep -q 'Armor family' mockup/gear.js
          grep -q 'Weapon family' mockup/gear.js
          grep -q 'Equipped' mockup/gear.js
          ! grep -q 'gear-slot-copy' mockup/gear.js
          ! grep -q 'armory-item-copy' mockup/gear.js
          ! grep -q 'armory-equip-action' mockup/gear.js

      - name: Start dev server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/gear.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/gear.html >/dev/null
          cat /tmp/warcraft-dev.log

      - name: Check relevant routes
        run: |
          for route in \
            /mockup/gear.html \
            /mockup/gear.js \
            /mockup/styles.css \
            /mockup/ui/wow-ui.css \
            /mockup/ui/wow-icons.js \
            /mockup/ui/wow-tooltips.js \
            /mockup/ui/wow-nav.js
          do
            echo "GET $route"
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install temporary browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check Gear browser contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900}});
          const errors = [];

          page.on("console", message => {
            if (message.type() === "error") errors.push(`console: ${message.text()}`);
          });
          page.on("pageerror", error => errors.push(`pageerror: ${error.message}`));

          const response = await page.goto(base + "/mockup/gear.html", {waitUntil:"domcontentloaded"});
          if (!response || !response.ok()) errors.push(`status: ${response?.status() ?? "none"}`);
          await page.waitForSelector(".hero-roster-card");
          await page.waitForSelector(".armory-item");
          await page.waitForTimeout(800);

          const layout = await page.evaluate(() => {
            const slots = [...document.querySelectorAll(".gear-slot")];
            const armory = [...document.querySelectorAll(".armory-item")];
            const slotRects = slots.map(el => el.getBoundingClientRect());
            const armoryRects = armory.slice(0,8).map(el => el.getBoundingClientRect());
            const portrait = document.querySelector("#heroPortrait");
            const classIcon = document.querySelector("#heroClassIcon img");
            return {
              slots:slots.length,
              slotCopy:document.querySelectorAll(".gear-slot-copy").length,
              maxSlotWidth:Math.max(...slotRects.map(r=>r.width)),
              maxSlotHeight:Math.max(...slotRects.map(r=>r.height)),
              armoryCount:armory.length,
              armoryCopy:document.querySelectorAll(".armory-item-copy,.armory-stats,.armory-equip-action").length,
              maxArmoryWidth:Math.max(...armoryRects.map(r=>r.width)),
              maxArmoryHeight:Math.max(...armoryRects.map(r=>r.height)),
              gridDisplay:getComputedStyle(document.querySelector(".armory-grid")).display,
              portraitSrc:portrait?.src || "",
              portraitAlt:portrait?.alt || "",
              classSrc:classIcon?.src || "",
              classFrame:document.querySelector("#heroClassIcon")?.className || "",
              filters:[
                document.querySelector("#tierFilter")?.className || "",
                document.querySelector("#slotFilter")?.className || "",
                document.querySelector("#gearSearch")?.className || "",
                document.querySelector(".gear-check")?.className || ""
              ]
            };
          });

          if (layout.slots !== 6) errors.push(`expected 6 equipment slots, got ${layout.slots}`);
          if (layout.slotCopy !== 0 || layout.maxSlotWidth > 82 || layout.maxSlotHeight > 90) errors.push("paper-doll slots are not compact/icon-first");
          if (layout.armoryCount < 1 || layout.armoryCopy !== 0 || layout.maxArmoryWidth > 70 || layout.maxArmoryHeight > 70 || layout.gridDisplay !== "grid") errors.push("armory is not compact icon-grid");
          if (!layout.portraitAlt.toLowerCase().includes("human") || !layout.classFrame.includes("class-mage") || layout.portraitSrc === layout.classSrc) errors.push("race portrait and class icon are not separated");
          if (!layout.filters[0].includes("wow-select") || !layout.filters[1].includes("wow-select") || !layout.filters[2].includes("wow-input") || !layout.filters[3].includes("wow-checkbox")) errors.push("filters are not using shared WoW form controls");

          const initialStats = await page.locator("#heroStats").innerText();

          // Candidate-vs-equipped comparison and structured tooltip data.
          const candidate = page.locator(".armory-item:not(.equipped):not(.locked)").first();
          await candidate.focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          const tooltipContract = await page.evaluate(() => {
            const primary = document.querySelector('[data-wow-tooltip-primary="true"]');
            const comparison = document.querySelector('[data-wow-tooltip-comparison="true"]');
            const primaryText = primary?.textContent || "";
            return {
              cards:document.querySelectorAll(".wow-tooltip-card").length,
              primaryText,
              comparisonText:comparison?.textContent || "",
              quality:primaryText.includes("Quality"),
              tier:primaryText.includes("Tier"),
              family:primaryText.includes("Armor family") || primaryText.includes("Weapon family"),
              primaryStat:primaryText.includes("Primary ·"),
              secondaryStat:primaryText.includes("Secondary ·"),
              equippedState:primaryText.includes("Equipped")
            };
          });
          if (tooltipContract.cards !== 2) errors.push("candidate item did not compare side-by-side with equipped item");
          if (!tooltipContract.quality || !tooltipContract.tier || !tooltipContract.family || !tooltipContract.primaryStat || !tooltipContract.secondaryStat || !tooltipContract.equippedState) {
            errors.push("item tooltip is missing required structured item data");
          }

          // Every visible armory item must expose the shared item tooltip.
          const visibleCount = await page.locator(".armory-item").count();
          for (let i = 0; i < visibleCount; i += 1) {
            const item = page.locator(".armory-item").nth(i);
            await item.focus();
            const variant = await page.locator(".wow-tooltip-card").first().getAttribute("class");
            const title = await page.locator(".wow-tooltip__title").first().textContent();
            if (!variant?.includes("wow-tooltip--item") || !title?.trim()) {
              errors.push(`armory item ${i} is missing shared item tooltip`);
              break;
            }
          }

          // Six-slot mechanics + stat updates: unequip Head, then re-equip the same best eligible Head item.
          const headSlot = page.locator("#leftSlots .gear-slot").first();
          const headBefore = await headSlot.getAttribute("aria-label");
          await headSlot.click();
          await page.waitForTimeout(150);
          const headEmpty = await page.locator("#leftSlots .gear-slot").first().getAttribute("aria-label");
          const unequippedStats = await page.locator("#heroStats").innerText();
          if (!headEmpty?.toLowerCase().includes("empty")) errors.push("clicking equipped Head did not unequip it");
          if (unequippedStats === initialStats) errors.push("unequipping gear did not update hero stats");

          await page.selectOption("#slotFilter","Head");
          await page.waitForTimeout(100);
          const headCandidate = page.locator(".armory-item:not(.locked)").first();
          await headCandidate.click();
          await page.waitForTimeout(150);
          const headAfter = await page.locator("#leftSlots .gear-slot").first().getAttribute("aria-label");
          const reequippedStats = await page.locator("#heroStats").innerText();
          if (headAfter?.toLowerCase().includes("empty") || headAfter === headEmpty) errors.push("armory click did not equip Head");
          if (reequippedStats !== initialStats) errors.push(`re-equipping the original best Head did not restore stats; before=${headBefore}, after=${headAfter}`);

          // Search behavior remains functional.
          await page.fill("#gearSearch","Spellstaff");
          await page.selectOption("#slotFilter","all");
          await page.waitForTimeout(100);
          const searched = await page.locator(".armory-item").count();
          const labels = await page.locator(".armory-item").evaluateAll(nodes => nodes.map(n=>n.getAttribute("aria-label") || ""));
          if (searched < 1 || labels.some(label => !label.toLowerCase().includes("spellstaff"))) errors.push("armory search behavior changed");

          // Mage armor restriction remains unchanged: T5 Head is Plate and must stay locked.
          await page.fill("#gearSearch","");
          await page.selectOption("#tierFilter","5");
          await page.selectOption("#slotFilter","Head");
          await page.locator("#equippableOnly").setChecked(false, {force:true});
          await page.waitForTimeout(100);
          const restricted = page.locator(".armory-item").first();
          const restrictedState = await restricted.evaluate(el => ({
            locked:el.classList.contains("locked"),
            ariaDisabled:el.getAttribute("aria-disabled"),
            label:el.getAttribute("aria-label") || ""
          }));
          if (!restrictedState.locked || restrictedState.ariaDisabled !== "true" || !restrictedState.label.includes("Mage cannot equip Plate")) {
            errors.push("Mage Plate armor restriction changed");
          }
          await restricted.focus();
          const lockedText = await page.locator(".wow-tooltip__locked").textContent();
          if (!lockedText.includes("Mage cannot equip Plate")) errors.push("restriction is not exposed in shared tooltip");

          // Locked item click must not replace currently equipped Head.
          const equippedHeadBeforeLockedClick = await page.locator("#leftSlots .gear-slot").first().getAttribute("aria-label");
          await restricted.click({force:true});
          await page.waitForTimeout(100);
          const equippedHeadAfterLockedClick = await page.locator("#leftSlots .gear-slot").first().getAttribute("aria-label");
          if (equippedHeadBeforeLockedClick !== equippedHeadAfterLockedClick) errors.push("locked armor became equippable");

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log("WOWUI-005 browser Gear contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Run deterministic simulation smoke test
        run: npm run simulation:test

# rerun-after-shared-checkbox-harness-fix
