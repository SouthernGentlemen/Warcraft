name: WOWUI-003 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wowui-003-verification.yml"

jobs:
  verify-tooltips:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check tooltip ownership and syntax
        run: |
          node --check mockup/ui/wow-tooltips.js
          node --check mockup/talent-calculator.js
          node --check mockup/gear.js
          node --check mockup/battle.js
          node --check mockup/base.js
          node --check mockup/race-selector.js
          ! grep -R -E 'id="talentTooltip"|function showTooltip|function positionTooltip' mockup/talent-calculator.html mockup/talent-calculator.js
          ! grep -R -E '\btitle="' mockup/talent-calculator.html mockup/gear.html mockup/battle.html mockup/base.html mockup/race-selector.html mockup/ui/index.html
          ! grep -R -E '\.title[[:space:]]*=' mockup/talent-calculator.js mockup/gear.js mockup/battle.js mockup/base.js mockup/race-selector.js
          grep -q "wow-tooltips.js" mockup/talent-calculator.html
          grep -q "wow-tooltips.js" mockup/gear.html
          grep -q "wow-tooltips.js" mockup/battle.html
          grep -q "wow-tooltips.js" mockup/base.html
          grep -q "wow-tooltips.js" mockup/race-selector.html

      - name: Start dev server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null
          cat /tmp/warcraft-dev.log

      - name: Check mockup routes
        run: |
          for route in \
            /mockup/ \
            /mockup/race-selector.html \
            /mockup/talent-calculator.html \
            /mockup/gear.html \
            /mockup/battle.html \
            /mockup/base.html \
            /mockup/simulation/ \
            /mockup/ui/ \
            /mockup/ui/wow-ui.css \
            /mockup/ui/wow-icons.js \
            /mockup/ui/wow-tooltips.js
          do
            echo "GET $route"
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install temporary browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser tooltip contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({ headless: true });
          const errors = [];

          async function open(route, viewport={width:1000,height:720}) {
            const page = await browser.newPage({viewport});
            page.on("console", message => {
              if (message.type() === "error") errors.push(`[${route}] console: ${message.text()}`);
            });
            page.on("pageerror", error => errors.push(`[${route}] pageerror: ${error.message}`));
            const response = await page.goto(base + route, {waitUntil:"domcontentloaded"});
            if (!response || !response.ok()) errors.push(`[${route}] status: ${response?.status() ?? "no response"}`);
            await page.waitForTimeout(700);
            return page;
          }

          function inside(rect, width, height) {
            return rect && rect.left >= -0.5 && rect.top >= -0.5 && rect.right <= width + 0.5 && rect.bottom <= height + 0.5;
          }

          const reference = await open("/mockup/ui/", {width:800,height:500});
          await reference.locator('[data-wow-tooltip="Generic control"]').focus();
          await reference.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          let focusState = await reference.evaluate(() => {
            const group = document.querySelector(".wow-tooltip-group");
            const trigger = document.activeElement;
            const rect = group.getBoundingClientRect();
            return {
              described:trigger?.getAttribute("aria-describedby"),
              role:group.getAttribute("role"),
              rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom}
            };
          });
          if (focusState.described !== "wow-shared-tooltip" || focusState.role !== "tooltip") errors.push("[ui] keyboard focus tooltip accessibility contract failed");
          if (!inside(focusState.rect,800,500)) errors.push("[ui] focus tooltip escaped viewport");

          await reference.evaluate(() => {
            const button = document.createElement("button");
            button.id = "edge-tooltip-test";
            button.textContent = "edge";
            Object.assign(button.style,{position:"fixed",right:"0",bottom:"0"});
            document.body.appendChild(button);
            window.WowUITooltips.show(button,{
              variant:"generic",
              title:"Viewport edge",
              description:"This tooltip must clamp inside the viewport."
            },{clientX:799,clientY:499});
          });
          const edgeRect = await reference.evaluate(() => {
            const rect = document.querySelector(".wow-tooltip-group").getBoundingClientRect();
            return {left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom};
          });
          if (!inside(edgeRect,800,500)) errors.push("[ui] cursor tooltip collision/clamping failed");

          await reference.locator("#tooltipCompareDemo").focus();
          const referenceComparison = await reference.evaluate(() => ({
            cards:document.querySelectorAll(".wow-tooltip-card").length,
            badges:[...document.querySelectorAll(".wow-tooltip__badge")].map(el=>el.textContent.trim())
          }));
          if (referenceComparison.cards !== 2 || !referenceComparison.badges.includes("Candidate") || !referenceComparison.badges.includes("Equipped")) {
            errors.push("[ui] reference item comparison did not render two structured tooltips");
          }
          await reference.close();

          const talent = await open("/mockup/talent-calculator.html");
          await talent.waitForSelector(".wow-talent-node.locked");
          await talent.locator(".wow-talent-node.locked").first().focus();
          await talent.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          const talentState = await talent.evaluate(() => {
            const card = document.querySelector(".wow-tooltip-card");
            const locked = document.querySelector(".wow-tooltip__locked");
            const title = document.querySelector(".wow-tooltip__title");
            const rect = document.querySelector(".wow-tooltip-group").getBoundingClientRect();
            return {
              variant:card?.className || "",
              locked:locked?.textContent.trim() || "",
              titleSize:parseFloat(getComputedStyle(title).fontSize),
              rect:{left:rect.left,top:rect.top,right:rect.right,bottom:rect.bottom}
            };
          });
          if (!talentState.variant.includes("wow-tooltip--talent")) errors.push("[talent] shared talent variant missing");
          if (!talentState.locked) errors.push("[talent] locked requirement missing");
          if (talentState.titleSize > 16) errors.push("[talent] tooltip typography is still oversized");
          if (!inside(talentState.rect,1000,720)) errors.push("[talent] tooltip escaped viewport");
          await talent.close();

          const gear = await open("/mockup/gear.html",{width:1280,height:800});
          await gear.waitForSelector(".armory-item:not(.equipped)");
          await gear.locator(".armory-item:not(.equipped)").first().focus();
          await gear.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          const gearState = await gear.evaluate(() => ({
            cards:document.querySelectorAll(".wow-tooltip-card").length,
            candidate:document.querySelector('[data-wow-tooltip-primary="true"] .wow-tooltip__badge')?.textContent.trim() || "",
            equipped:document.querySelector('[data-wow-tooltip-comparison="true"] .wow-tooltip__badge')?.textContent.trim() || "",
            hasStats:document.querySelectorAll(".wow-tooltip__stat").length > 0
          }));
          if (gearState.cards !== 2 || gearState.candidate !== "Candidate" || gearState.equipped !== "Equipped" || !gearState.hasStats) {
            errors.push("[gear] candidate/equipped comparison tooltip contract failed");
          }
          await gear.close();

          const battle = await open("/mockup/battle.html");
          await battle.waitForSelector(".combatant-avatar");
          await battle.locator(".combatant-avatar").first().focus();
          let battleVariant = await battle.locator(".wow-tooltip-card").getAttribute("class");
          if (!battleVariant?.includes("wow-tooltip--unit")) errors.push("[battle] unit tooltip variant missing");
          await battle.locator(".resource-stat").first().focus();
          battleVariant = await battle.locator(".wow-tooltip-card").getAttribute("class");
          if (!battleVariant?.includes("wow-tooltip--resource")) errors.push("[battle] resource tooltip variant missing");
          await battle.close();

          const basePage = await open("/mockup/base.html");
          await basePage.locator('.base-plot[data-building="blacksmith"]').focus();
          let baseVariant = await basePage.locator(".wow-tooltip-card").getAttribute("class");
          if (!baseVariant?.includes("wow-tooltip--profession")) errors.push("[base] profession tooltip variant missing");
          await basePage.locator('[data-resource="gold"]').focus();
          baseVariant = await basePage.locator(".wow-tooltip-card").getAttribute("class");
          if (!baseVariant?.includes("wow-tooltip--resource")) errors.push("[base] resource tooltip variant missing");
          await basePage.locator('[data-currency="renown"]').focus();
          baseVariant = await basePage.locator(".wow-tooltip-card").getAttribute("class");
          if (!baseVariant?.includes("wow-tooltip--currency")) errors.push("[base] currency tooltip variant missing");
          await basePage.close();

          const race = await open("/mockup/race-selector.html");
          await race.waitForSelector(".race-button");
          await race.locator(".race-button").first().focus();
          let raceVariant = await race.locator(".wow-tooltip-card").getAttribute("class");
          if (!raceVariant?.includes("wow-tooltip--race")) errors.push("[race] race tooltip variant missing");
          await race.locator(".class-chip").first().focus();
          raceVariant = await race.locator(".wow-tooltip-card").getAttribute("class");
          if (!raceVariant?.includes("wow-tooltip--class")) errors.push("[race] class tooltip variant missing");
          await race.close();

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log("WOWUI-003 browser tooltip contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Run deterministic simulation smoke test
        run: npm run simulation:test
