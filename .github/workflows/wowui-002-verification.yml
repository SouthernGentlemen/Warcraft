name: WOWUI-002 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wowui-002-verification.yml"

jobs:
  verify-icon-system:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check shared ownership
        run: |
          ! grep -E "WOWHEAD_ICON_ROOT|FALLBACK_ICON" mockup/talent-calculator.js mockup/gear.js mockup/battle.js
          ! grep -E "quality-white|quality-green|quality-blue|quality-epic" mockup/styles.css mockup/gear.js mockup/gear.html
          ! grep -E "\.class-[a-z-]+\{--class:#" mockup/styles.css
          grep -q -- "--wow-class-shaman: #0070dd" mockup/ui/wow-ui.css
          grep -q -- "--wow-rarity-uncommon: #1eff00" mockup/ui/wow-ui.css
          grep -q "wow-icons.js" mockup/talent-calculator.html
          grep -q "wow-icons.js" mockup/gear.html
          grep -q "wow-icons.js" mockup/battle.html

      - name: Start dev server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null
          cat /tmp/warcraft-dev.log

      - name: Check mockup routes
        run: |
          for route in \
            /mockup/ \
            /mockup/index.html \
            /mockup/race-selector.html \
            /mockup/talent-calculator.html \
            /mockup/gear.html \
            /mockup/battle.html \
            /mockup/base.html \
            /mockup/simulation/ \
            /mockup/ui/ \
            /mockup/ui/index.html \
            /mockup/ui/wow-ui.css \
            /mockup/ui/wow-icons.js
          do
            echo "GET $route"
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install temporary browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser and icon contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const routes = [
            "/mockup/",
            "/mockup/index.html",
            "/mockup/race-selector.html",
            "/mockup/talent-calculator.html",
            "/mockup/gear.html",
            "/mockup/battle.html",
            "/mockup/base.html",
            "/mockup/simulation/",
            "/mockup/ui/"
          ];

          const browser = await chromium.launch({ headless: true });
          const errors = [];

          for (const route of routes) {
            const page = await browser.newPage();
            page.on("console", message => {
              if (message.type() === "error") errors.push(`[${route}] console: ${message.text()}`);
            });
            page.on("pageerror", error => errors.push(`[${route}] pageerror: ${error.message}`));
            const response = await page.goto(base + route, { waitUntil: "domcontentloaded" });
            if (!response || !response.ok()) errors.push(`[${route}] status: ${response?.status() ?? "no response"}`);
            await page.waitForTimeout(900);
            await page.close();
          }

          const reference = await browser.newPage();
          await reference.goto(base + "/mockup/ui/", { waitUntil: "domcontentloaded" });
          const contract = await reference.evaluate(() => {
            const api = window.WowUIIcons;
            const samples = [
              ["class","mage",{}],
              ["spec","restoration",{classId:"shaman"}],
              ["race","orc",{}],
              ["faction","alliance",{}],
              ["equipment-slot","head",{}],
              ["item-family","plate",{slot:"chest"}],
              ["ability","heal",{}],
              ["talent","capstone",{}],
              ["profession","blacksmith",{}],
              ["building","keep",{}],
              ["currency","gold",{}],
              ["resource","mana",{}],
              ["battle","pause",{}]
            ];
            return {
              hasApi:Boolean(api),
              fallback:api?.fallbackUrl || "",
              urls:samples.map(([category,key,context]) => api?.resolve(category,key,context) || ""),
              unknown:api?.resolve("class","not-a-class") || "",
              shaman:getComputedStyle(document.documentElement).getPropertyValue("--wow-class-shaman").trim(),
              uncommon:getComputedStyle(document.documentElement).getPropertyValue("--wow-rarity-uncommon").trim(),
              frameCount:document.querySelectorAll(".wow-icon-frame").length,
              factionCount:document.querySelectorAll(".wow-faction-crest img").length
            };
          });

          if (!contract.hasApi) errors.push("[ui] WowUIIcons API missing");
          if (!contract.urls.every(url => url && url !== contract.fallback)) errors.push("[ui] semantic resolver returned fallback for a required category");
          if (contract.unknown !== contract.fallback) errors.push("[ui] unknown semantic key did not use shared fallback");
          if (contract.shaman.toLowerCase() !== "#0070dd") errors.push("[ui] Shaman token is not canonical shared value");
          if (contract.uncommon.toLowerCase() !== "#1eff00") errors.push("[ui] uncommon token is not canonical shared value");
          if (contract.frameCount < 5) errors.push("[ui] icon frame reference states missing");
          if (contract.factionCount < 2) errors.push("[ui] faction crest reference missing");
          await reference.close();

          const fallbackPage = await browser.newPage();
          await fallbackPage.goto(base + "/mockup/ui/", { waitUntil: "domcontentloaded" });
          const fallbackResult = await fallbackPage.evaluate(async () => {
            const img = document.createElement("img");
            window.WowUIIcons.bindFallback(img);
            document.body.appendChild(img);
            img.src = window.WowUIIcons.iconUrl("definitely_missing_wowui_002_asset");
            await new Promise(resolve => setTimeout(resolve, 2500));
            return {
              src:img.src,
              inline:img.classList.contains("wow-icon-fallback"),
              width:img.naturalWidth
            };
          });
          if (!(fallbackResult.inline || fallbackResult.src.includes("inv_misc_questionmark"))) errors.push("[ui] missing asset did not fall back");
          await fallbackPage.close();

          const gear = await browser.newPage();
          await gear.goto(base + "/mockup/gear.html", { waitUntil: "domcontentloaded" });
          await gear.waitForSelector(".armory-item");
          const gearState = await gear.evaluate(() => ({
            legend:document.querySelector(".gear-tier-legend")?.textContent || "",
            qualities:[...document.querySelectorAll(".armory-item-top em")].map(el => el.textContent),
            crest:Boolean(document.querySelector("#heroFactionBadge img")),
            tierBadge:Boolean(document.querySelector(".armory-item .wow-icon-tier")),
            rarityFrame:Boolean(document.querySelector(".armory-item .wow-icon-frame--quality-epic, .armory-item .wow-icon-frame--quality-rare, .armory-item .wow-icon-frame--quality-uncommon, .armory-item .wow-icon-frame--quality-common"))
          }));
          if (!gearState.legend.includes("Common") || !gearState.legend.includes("Rare")) errors.push("[gear] tier/quality legend not separated");
          if (gearState.qualities.some(q => ["White","Green","Blue"].includes(q))) errors.push("[gear] color-name quality labels remain");
          if (!gearState.crest || !gearState.tierBadge || !gearState.rarityFrame) errors.push("[gear] shared crest/tier/rarity frame missing");
          await gear.close();

          const battle = await browser.newPage();
          await battle.goto(base + "/mockup/battle.html", { waitUntil: "domcontentloaded" });
          await battle.waitForSelector(".combatant");
          const battleState = await battle.evaluate(() => ({
            crests:[...document.querySelectorAll(".faction-crest img")].length,
            raceIcons:[...document.querySelectorAll(".race-badge img")].length,
            classFrames:[...document.querySelectorAll(".combatant-avatar.wow-icon-frame")].length
          }));
          if (battleState.crests !== 2 || battleState.raceIcons !== 12 || battleState.classFrames !== 12) errors.push("[battle] shared faction/race/class icon treatment missing");
          await battle.close();

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log("WOWUI-002 browser/icon contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Run deterministic simulation smoke test
        run: npm run simulation:test
