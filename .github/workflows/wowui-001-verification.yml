name: WOWUI-001 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wowui-001-verification.yml"

jobs:
  verify-ui-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start dev server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null
          cat /tmp/warcraft-dev.log

      - name: Check mockup routes
        run: |
          for route in \
            /mockup/ \
            /mockup/index.html \
            /mockup/race-selector.html \
            /mockup/talent-calculator.html \
            /mockup/gear.html \
            /mockup/battle.html \
            /mockup/base.html \
            /mockup/simulation/ \
            /mockup/simulation/index.html \
            /mockup/ui/ \
            /mockup/ui/index.html \
            /mockup/ui/wow-ui.css
          do
            echo "GET $route"
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install temporary browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser console
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const routes = [
            "/mockup/",
            "/mockup/index.html",
            "/mockup/race-selector.html",
            "/mockup/talent-calculator.html",
            "/mockup/gear.html",
            "/mockup/battle.html",
            "/mockup/base.html",
            "/mockup/simulation/",
            "/mockup/simulation/index.html",
            "/mockup/ui/",
            "/mockup/ui/index.html"
          ];

          const browser = await chromium.launch({ headless: true });
          const errors = [];

          for (const route of routes) {
            const page = await browser.newPage();
            page.on("console", message => {
              if (message.type() === "error") errors.push(`[${route}] console: ${message.text()}`);
            });
            page.on("pageerror", error => errors.push(`[${route}] pageerror: ${error.message}`));

            const response = await page.goto(base + route, { waitUntil: "domcontentloaded" });
            if (!response || !response.ok()) {
              errors.push(`[${route}] navigation status: ${response?.status() ?? "no response"}`);
            }
            await page.waitForTimeout(1200);
            await page.close();
          }

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log("browser console: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Run deterministic simulation smoke test
        run: npm run simulation:test
