name: WOWUI-006 Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wowui-006-audit.yml"
      - "mockup/race-selector.html"
      - "mockup/race-selector.js"
      - "mockup/race-selector.css"
      - "mockup/ui/**"

jobs:
  audit-race-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source and syntax checks
        run: |
          node --check mockup/race-selector.js
          node --check mockup/ui/wow-icons.js
          grep -Fq 'race-selector.css' mockup/race-selector.html
          grep -Fq 'wow-game-shell' mockup/race-selector.html
          grep -Fq 'race-faction-controls' mockup/race-selector.html
          grep -Fq 'race-class-grid' mockup/race-selector.html
          grep -Fq 'Tooltips.attach($("racialTalent")' mockup/race-selector.js
          grep -Fq 'classIndex.classes.forEach' mockup/race-selector.js
          grep -Fq 'Icons.resolve("race", state.race, {body:state.body})' mockup/race-selector.js
          grep -Fq 'racial: {' mockup/ui/wow-icons.js
          ! grep -Fq 'class="segmented"' mockup/race-selector.html
          ! grep -Fq 'silhouette' mockup/race-selector.html
          ! grep -Fq 'class-chip' mockup/race-selector.html
          ! grep -Fq 'racialMechanic' mockup/race-selector.html

      - name: Start mockup server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/race-selector.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/race-selector.html >/dev/null
          for route in /mockup/race-selector.js /mockup/race-selector.css /mockup/ui/wow-ui.css /mockup/ui/wow-icons.js /mockup/ui/wow-tooltips.js /mockup/ui/wow-nav.js /data/heroes/races/index.json /data/heroes/classes/index.json; do
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done
          cat /tmp/warcraft-dev.log

      - name: Install browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise Race Selector acceptance contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on("console", msg => { if (msg.type() === "error") errors.push("console: " + msg.text()); });
          page.on("pageerror", err => errors.push("pageerror: " + err.message));
          const assert = (condition, message) => { if (!condition) errors.push(message); };

          const tooltipBoundsOK = async () => page.evaluate(() => {
            const group = document.querySelector(".wow-tooltip-group");
            if (!group) return false;
            const r = group.getBoundingClientRect();
            return r.left >= 0 && r.top >= 0 && r.right <= innerWidth + 1 && r.bottom <= innerHeight + 1;
          });

          const response = await page.goto(base + "/mockup/race-selector.html", { waitUntil: "domcontentloaded" });
          assert(Boolean(response?.ok()), "Race Selector route did not load");
          await page.waitForSelector(".race-option");
          await page.waitForSelector(".race-class-button");

          // Shared navigation and no legacy segmented/mannequin language.
          assert(await page.locator(".wow-game-shell").count() === 1, "Shared persistent navigation is missing");
          assert(await page.locator(".segmented,.silhouette,.class-chip,.racial").count() === 0, "Legacy Race Selector UI remains in the DOM");

          // Initial Alliance state.
          let state = await page.evaluate(() => ({
            faction: document.querySelector("#stageFaction")?.textContent,
            race: document.querySelector("#stageRace")?.textContent,
            body: document.querySelector("#stageBody")?.textContent,
            raceOptions: document.querySelectorAll(".race-option").length,
            classes: document.querySelectorAll(".race-class-button").length,
            lockedClasses: document.querySelectorAll(".race-class-button.is-locked").length,
            activeFaction: document.querySelector(".race-faction-button.is-selected")?.dataset.faction,
            activeRace: document.querySelector(".race-option.is-selected")?.dataset.race,
            stagePortrait: document.querySelector("#stagePortrait")?.src || ""
          }));
          assert(state.faction === "Alliance" && state.race === "Human", "Initial Alliance/Human state changed");
          assert(state.body.includes("Body 1") && state.body.includes("Male"), "Initial Body 1 state changed");
          assert(state.raceOptions === 3, "Alliance race list is not three races");
          assert(state.classes === 9 && state.lockedClasses === 1, "Class visibility/locking contract is wrong");
          assert(state.activeFaction === "alliance" && state.activeRace === "human", "Initial selected controls are wrong");

          const lockedAlliance = page.locator(".race-class-button.is-locked").first();
          assert((await lockedAlliance.getAttribute("aria-label"))?.startsWith("Shaman"), "Alliance should visibly lock Shaman");
          await lockedAlliance.focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          let lockedText = await page.locator(".wow-tooltip-card").textContent();
          assert(lockedText.includes("Shaman") && lockedText.includes("unavailable"), "Locked Shaman tooltip is incomplete");
          assert(await tooltipBoundsOK(), "Locked class tooltip escaped viewport");

          // Class icons use shared class frames.
          const classFrames = await page.locator(".race-class-button .wow-icon-frame").count();
          assert(classFrames === 9, "Classes are not icon-driven");
          const paladin = page.locator('.race-class-button[aria-label^="Paladin"]').first();
          assert(!(await paladin.getAttribute("class")).includes("is-locked"), "Paladin should be available to Alliance");

          // Race selection remains functional.
          const dwarf = page.locator('.race-option[data-race="dwarf"]');
          await dwarf.click();
          await page.waitForFunction(() => document.querySelector("#stageRace")?.textContent === "Dwarf");
          assert((await page.locator("#raceName").textContent()) === "Dwarf", "Race detail did not follow Dwarf selection");
          assert((await dwarf.getAttribute("aria-pressed")) === "true", "Race selected state is not exposed");

          // Body selection changes presentation and shared icon resolution.
          const portraitBefore = await page.locator("#stagePortrait").getAttribute("src");
          const body2 = page.locator('.race-body-button[data-body="body-2"]');
          await body2.click();
          await page.waitForFunction(() => document.querySelector("#stageBody")?.textContent.includes("Female"));
          const portraitAfter = await page.locator("#stagePortrait").getAttribute("src");
          assert(portraitBefore !== portraitAfter, "Body toggle did not change character portrait presentation");
          assert((await body2.getAttribute("aria-pressed")) === "true", "Body selected state is not exposed");
          assert((await page.locator(".race-option").first().locator("img").getAttribute("src"))?.includes("female"), "Race controls did not follow Body 2 portrait context");

          // Racial uses shared ability tooltip, not permanent mechanic copy.
          const racial = page.locator("#racialTalent");
          assert(await page.locator("#racialMechanic").count() === 0, "Permanent racial mechanic copy remains");
          await racial.focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--ability");
          let racialText = await page.locator(".wow-tooltip--ability").textContent();
          assert(racialText.includes("Treasure Finder") && racialText.includes("10% chance"), "Dwarf racial shared tooltip is incomplete");
          assert(await tooltipBoundsOK(), "Keyboard racial tooltip escaped viewport");
          await racial.hover();
          await page.waitForTimeout(60);
          assert(await page.locator(".wow-tooltip--ability").count() === 1, "Mouse hover did not show racial ability tooltip");

          // Horde faction switches races, atmosphere and class availability.
          const horde = page.locator('.race-faction-button[data-faction="horde"]');
          await horde.click();
          await page.waitForFunction(() => document.querySelector("#stageFaction")?.textContent === "Horde");
          state = await page.evaluate(() => ({
            race: document.querySelector("#stageRace")?.textContent,
            faction: document.querySelector("#stageFaction")?.textContent,
            options: [...document.querySelectorAll(".race-option")].map(el => el.dataset.race),
            locked: document.querySelector(".race-class-button.is-locked")?.getAttribute("aria-label") || "",
            stageClass: document.querySelector("#characterStage")?.className || "",
            crestClass: document.querySelector("#stageFactionCrest")?.className || ""
          }));
          assert(state.faction === "Horde" && state.race === "Orc", "Horde did not reset to its first race");
          assert(state.options.join(",") === "orc,undead,troll", "Horde race list is incorrect");
          assert(state.locked.startsWith("Paladin"), "Horde should visibly lock Paladin");
          assert(state.stageClass.includes("is-horde") && state.crestClass.includes("wow-faction-crest--horde"), "Horde atmosphere/crest state is wrong");

          const shaman = page.locator('.race-class-button[aria-label^="Shaman"]').first();
          assert(!(await shaman.getAttribute("class")).includes("is-locked"), "Shaman should be available to Horde");

          // Keyboard focus remains visible on the custom controls.
          await horde.focus();
          const factionFocus = await horde.evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(factionFocus, "Faction keyboard focus is not visible");
          await page.locator('.race-option[data-race="troll"]').focus();
          const raceFocus = await page.locator('.race-option[data-race="troll"]').evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(raceFocus, "Race keyboard focus is not visible");

          // Responsive behavior at supported widths.
          for (const viewport of [
            { width: 1020, height: 900 },
            { width: 820, height: 900 },
            { width: 620, height: 900 },
            { width: 390, height: 844 }
          ]) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(80);
            const responsive = await page.evaluate(() => {
              const shell = document.querySelector(".race-shell")?.getBoundingClientRect();
              const stage = document.querySelector("#characterStage")?.getBoundingClientRect();
              const factionButtons = [...document.querySelectorAll(".race-faction-button")].map(el => el.getBoundingClientRect());
              const raceButtons = [...document.querySelectorAll(".race-option")].map(el => el.getBoundingClientRect());
              return {
                viewport: innerWidth,
                shellRight: shell?.right || 0,
                shellLeft: shell?.left || 0,
                stageWidth: stage?.width || 0,
                minFactionHeight: Math.min(...factionButtons.map(r => r.height)),
                minRaceHeight: Math.min(...raceButtons.map(r => r.height))
              };
            });
            assert(responsive.shellLeft >= -1 && responsive.shellRight <= responsive.viewport + 1, "Race shell overflows at " + viewport.width + "px");
            assert(responsive.stageWidth > 0 && responsive.stageWidth <= responsive.viewport + 1, "Character stage overflows at " + viewport.width + "px");
            assert(responsive.minFactionHeight >= 44, "Faction controls are too small at " + viewport.width + "px");
            assert(responsive.minRaceHeight >= 70, "Race controls are too small at " + viewport.width + "px");
          }

          // Narrow racial tooltip still clamps.
          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator("#racialTalent").focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--ability");
          assert(await tooltipBoundsOK(), "Narrow racial tooltip escaped viewport");

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log("WOWUI-006 browser acceptance contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Deterministic simulation smoke test
        run: npm run simulation:test
