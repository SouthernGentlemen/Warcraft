name: Warcraft Mockup Acceptance

on:
  push:
    paths:
      - "mockup/**/*.js"
      - "mockup/**/*.html"
      - "mockup/**/*.css"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "dev-server.mjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "mockup/**/*.js"
      - "mockup/**/*.html"
      - "mockup/**/*.css"
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "dev-server.mjs"
      - ".github/workflows/**"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run integration and combat acceptance
        run: npm test
