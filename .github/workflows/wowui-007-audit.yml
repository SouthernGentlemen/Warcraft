name: WOWUI-007 Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wowui-007-audit.yml"
      - "mockup/talent-calculator.html"
      - "mockup/talent-calculator.js"
      - "mockup/talent-calculator.css"
      - "mockup/styles.css"
      - "mockup/ui/**"

jobs:
  audit-talents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source and syntax checks
        run: |
          node --check mockup/talent-calculator.js
          node --check mockup/ui/wow-tooltips.js
          grep -Fq 'talent-calculator.css' mockup/talent-calculator.html
          grep -Fq 'class="wow-select"' mockup/talent-calculator.html
          grep -Fq 'class="wow-range"' mockup/talent-calculator.html
          grep -Fq 'class="wow-button"' mockup/talent-calculator.html
          grep -Fq 'Tooltips.attach(button' mockup/talent-calculator.js
          grep -Fq 'marker-end=' mockup/talent-calculator.js
          grep -Fq 'wow-connector-shadow' mockup/talent-calculator.js
          grep -Fq 'choice' mockup/talent-calculator.js
          grep -Fq 'capstone' mockup/talent-calculator.js
          grep -Fq '.wow-range' mockup/ui/wow-ui.css
          ! grep -Fq 'TREE_THEMES' mockup/talent-calculator.js
          ! grep -Fq 'WoW-style talent calculator' mockup/styles.css
          ! grep -Fq 'wow-reset' mockup/talent-calculator.html
          ! grep -Fq 'wow-talent-tooltip' mockup/talent-calculator.js

      - name: Start mockup server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/talent-calculator.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/talent-calculator.html >/dev/null
          for route in /mockup/talent-calculator.js /mockup/talent-calculator.css /mockup/styles.css /mockup/ui/wow-ui.css /mockup/ui/wow-icons.js /mockup/ui/wow-tooltips.js /mockup/ui/wow-nav.js /data/heroes/classes/index.json; do
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise Talent Calculator acceptance contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on("console", msg => { if (msg.type() === "error") errors.push("console: " + msg.text()); });
          page.on("pageerror", err => errors.push("pageerror: " + err.message));
          const assert = (condition, message) => { if (!condition) errors.push(message); };
          const waitRender = () => page.waitForTimeout(80);

          const tooltipBoundsOK = async () => page.evaluate(() => {
            const group = document.querySelector(".wow-tooltip-group");
            if (!group) return false;
            const r = group.getBoundingClientRect();
            return r.left >= 0 && r.top >= 0 && r.right <= innerWidth + 1 && r.bottom <= innerHeight + 1;
          });

          const response = await page.goto(base + "/mockup/talent-calculator.html", { waitUntil: "domcontentloaded" });
          assert(Boolean(response?.ok()), "Talent Calculator route did not load");
          await page.waitForSelector(".wow-talent-node");
          await page.waitForSelector(".wow-spec-panel");

          // Shared navigation and shared controls.
          assert(await page.locator(".wow-game-shell").count() === 1, "Shared persistent navigation is missing");
          assert((await page.locator("#classSelect").getAttribute("class"))?.includes("wow-select"), "Class select is not using shared select styling");
          assert((await page.locator("#levelRange").getAttribute("class"))?.includes("wow-range"), "Level range is not using shared range styling");
          assert((await page.locator("#resetBuild").getAttribute("class"))?.includes("wow-button"), "Reset is not using shared button styling");

          const initial = await page.evaluate(() => ({
            points: document.querySelector("#pointsUsed")?.textContent,
            nodes: document.querySelectorAll(".wow-talent-node").length,
            capstones: document.querySelectorAll(".wow-talent-node.capstone").length,
            locked: document.querySelectorAll(".wow-talent-node.locked").length,
            specs: [...document.querySelectorAll(".wow-spec-name strong")].map(el => el.textContent),
            connectors: document.querySelectorAll(".wow-connector").length,
            shadows: document.querySelectorAll(".wow-connector-shadow").length,
            arrows: document.querySelectorAll(".wow-connector-arrow").length
          }));
          assert(initial.points === "0 / 5", "Initial talent point total changed");
          assert(initial.nodes === 24 && initial.capstones === 6, "Talent node/capstone counts changed");
          assert(initial.specs.join(",") === "Balance,Feral,Restoration", "Initial Druid spec order changed");
          assert(initial.connectors === 21 && initial.shadows === 21 && initial.arrows === 3, "Connector structure is incomplete");

          // Density and shape language.
          const density = await page.evaluate(() => {
            const node = document.querySelector(".wow-talent-node");
            const frame = node?.querySelector(".wow-icon-frame");
            const cap = document.querySelector(".wow-talent-node.capstone");
            return {
              node: node?.getBoundingClientRect().width || 0,
              frame: frame?.getBoundingClientRect().width || 0,
              choiceShape: getComputedStyle(node, "::before").clipPath,
              capTransform: getComputedStyle(cap, "::before").transform
            };
          });
          assert(density.node <= 64 && density.frame <= 58, "Talent nodes are still oversized");
          assert(density.choiceShape && density.choiceShape !== "none", "Choice-node shape language is missing");
          assert(density.capTransform && density.capTransform !== "none", "Capstone shape language is missing");

          // Shared tooltip from keyboard focus.
          const first = page.locator(".wow-spec-panel").first().locator(".wow-talent-row.row-1 .wow-talent-node").first();
          await first.focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--talent");
          let tooltipText = await page.locator(".wow-tooltip--talent").textContent();
          assert(tooltipText.includes("Choice Talent") && tooltipText.includes("Required level") && tooltipText.includes("Available"), "Talent shared tooltip is incomplete");
          assert(await tooltipBoundsOK(), "Talent keyboard tooltip escaped viewport");
          assert(await page.locator(".wow-tooltip-layer").count() === 1, "More than one tooltip engine/layer is present");

          // Left-click selects primary spec and activates dependency connectors.
          await first.click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "1 / 5", "Left-click did not spend one point");
          assert(await page.locator(".wow-spec-panel.primary-spec").count() === 1, "Primary specialization was not selected");
          assert(await page.locator(".wow-spec-panel.spec-locked").count() === 2, "Off-spec trees did not lock after primary choice");
          assert(await page.locator(".wow-spec-panel.primary-spec .wow-connector.active").count() === 3, "Tier 1 dependency connectors did not illuminate");
          assert(await page.locator(".wow-spec-panel.primary-spec .wow-talent-row.row-2 .wow-talent-node.available").count() === 3, "Tier 2 did not unlock in primary spec");

          // Right-click unlearn restores exact initial state.
          const learned = page.locator(".wow-spec-panel.primary-spec .wow-talent-row.row-1 .wow-talent-node.selected");
          await learned.click({ button: "right" });
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "0 / 5", "Right-click did not unlearn talent");
          assert(await page.locator(".wow-spec-panel.primary-spec").count() === 0, "Primary spec did not clear after unlearning Tier 1");
          assert(await page.locator(".wow-spec-panel.spec-locked").count() === 0, "Off-spec lock remained after unlearning Tier 1");

          // Level gating remains unchanged.
          await page.locator("#levelRange").fill("1");
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "0 / 1", "Level 1 point total is wrong");
          const tier2Locked = page.locator(".wow-spec-panel").first().locator(".wow-talent-row.row-2 .wow-talent-node").first();
          await tier2Locked.focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--talent");
          tooltipText = await page.locator(".wow-tooltip--talent").textContent();
          assert(tooltipText.includes("Requires Level 2"), "Level 2 gate changed");

          const levelOneFirst = page.locator(".wow-spec-panel").first().locator(".wow-talent-row.row-1 .wow-talent-node").first();
          await levelOneFirst.click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "1 / 1", "Level 1 spend limit changed");
          const otherTier1 = page.locator(".wow-spec-panel.primary-spec .wow-talent-row.row-1 .wow-talent-node").nth(1);
          await otherTier1.click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "1 / 1", "Point cap allowed an extra Level 1 talent");

          // Level 3 primary path: one Tier 1, one Tier 2, one capstone.
          await page.locator("#resetBuild").click();
          await page.locator("#levelRange").fill("3");
          await waitRender();
          let primaryPanel = page.locator(".wow-spec-panel").first();
          await primaryPanel.locator(".wow-talent-row.row-1 .wow-talent-node").first().click();
          await waitRender();
          primaryPanel = page.locator(".wow-spec-panel.primary-spec");
          await primaryPanel.locator(".wow-talent-row.row-2 .wow-talent-node").first().click();
          await waitRender();
          assert(await page.locator(".wow-spec-panel.primary-spec .wow-connector.active").count() === 7, "Tier 2 dependency connectors did not illuminate");
          await page.locator(".wow-spec-panel.primary-spec .wow-talent-row.row-3 .wow-talent-node").first().click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "3 / 3", "Primary path point total changed");
          assert(await page.locator(".wow-spec-panel.spec-locked").count() === 0, "Completing capstone did not unlock off-spec trees");

          // Level increase allows off-spec spending; lowering below spent points resets.
          await page.locator("#levelRange").fill("5");
          await waitRender();
          const offspec = page.locator(".wow-spec-panel").nth(1).locator(".wow-talent-row.row-1 .wow-talent-node").first();
          await offspec.click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "4 / 5", "Off-spec point after capstone changed");
          await page.locator("#levelRange").fill("2");
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "0 / 2", "Lowering level below spent points no longer resets build");

          // Reset and class selection preserve behavior.
          await page.locator("#levelRange").fill("5");
          await page.locator(".wow-spec-panel").first().locator(".wow-talent-row.row-1 .wow-talent-node").first().click();
          await waitRender();
          await page.locator("#resetBuild").click();
          await waitRender();
          assert((await page.locator("#pointsUsed").textContent()) === "0 / 5", "Reset control did not clear build");

          await page.selectOption("#classSelect", "mage");
          await page.waitForFunction(() => document.querySelector(".wow-spec-name strong")?.textContent === "Arcane");
          const mageSpecs = await page.locator(".wow-spec-name strong").allTextContents();
          assert(mageSpecs.join(",") === "Arcane,Fire,Frost", "Class selection no longer loads Mage specs");
          assert((await page.locator("#pointsUsed").textContent()) === "0 / 5", "Class change did not reset talent points");

          // Mouse tooltip also uses the shared layer.
          const mageNode = page.locator(".wow-talent-node").first();
          await mageNode.hover();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--talent");
          assert(await page.locator(".wow-tooltip--talent").count() === 1, "Mouse hover did not use the shared talent tooltip");
          assert(await tooltipBoundsOK(), "Mouse talent tooltip escaped viewport");

          // Shared control focus remains visible.
          await page.locator("#classSelect").focus();
          let outline = await page.locator("#classSelect").evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(outline, "Class select keyboard focus is not visible");
          await page.locator("#levelRange").focus();
          outline = await page.locator("#levelRange").evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(outline, "Shared range keyboard focus is not visible");
          await page.locator("#resetBuild").focus();
          outline = await page.locator("#resetBuild").evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(outline, "Reset keyboard focus is not visible");

          // Responsive shell stays usable; tree remains intentionally horizontally scrollable.
          for (const viewport of [
            { width: 1160, height: 900 },
            { width: 620, height: 900 },
            { width: 390, height: 844 }
          ]) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(80);
            const responsive = await page.evaluate(() => {
              const shell = document.querySelector(".talent-shell")?.getBoundingClientRect();
              const board = document.querySelector(".wow-tree-board");
              const controls = [...document.querySelectorAll("#classSelect,#resetBuild")].map(el => el.getBoundingClientRect().height);
              return {
                viewport: innerWidth,
                shellLeft: shell?.left || 0,
                shellRight: shell?.right || 0,
                boardClient: board?.clientWidth || 0,
                boardScroll: board?.scrollWidth || 0,
                minControl: Math.min(...controls)
              };
            });
            assert(responsive.shellLeft >= -1 && responsive.shellRight <= responsive.viewport + 1, "Talent shell overflows at " + viewport.width + "px");
            assert(responsive.boardScroll >= responsive.boardClient, "Talent tree lost horizontal scrolling at " + viewport.width + "px");
            assert(responsive.minControl >= 32, "Talent controls became too small at " + viewport.width + "px");
          }

          await page.setViewportSize({ width: 390, height: 844 });
          await page.locator(".wow-talent-node").first().focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--talent");
          assert(await tooltipBoundsOK(), "Narrow talent tooltip escaped viewport");

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log("WOWUI-007 browser acceptance contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Deterministic simulation smoke test
        run: npm run simulation:test
