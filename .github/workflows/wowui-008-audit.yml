name: WOWUI-008 Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wowui-008-audit.yml"
      - "mockup/battle.html"
      - "mockup/battle.js"
      - "mockup/battle.css"
      - "mockup/styles.css"
      - "mockup/ui/**"

jobs:
  audit-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source and syntax checks
        run: |
          node --check mockup/battle.js
          grep -Fq 'battle.css' mockup/battle.html
          grep -Fq 'wow-faction-crest--alliance' mockup/battle.html
          grep -Fq 'wow-faction-crest--horde' mockup/battle.html
          grep -Fq 'wow-button wow-button--primary' mockup/battle.html
          grep -Fq 'wow-tab' mockup/battle.html
          grep -Fq 'unit-frame wow-class--' mockup/battle.js
          grep -Fq 'Icons.resolve("race", unit.race)' mockup/battle.js
          grep -Fq 'Icons.resolve("class", classId)' mockup/battle.js
          grep -Fq 'unit-action-icon' mockup/battle.js
          grep -Fq 'spawnMissFeedback' mockup/battle.js
          grep -Fq '"DEFEATED"' mockup/battle.js
          grep -Fq '"COOLDOWN"' mockup/battle.js
          grep -Fq '"ULTIMATE"' mockup/battle.js
          grep -Fq 'buff-hooks' mockup/battle.js
          grep -Fq 'debuff-hooks' mockup/battle.js
          ! grep -Fq 'Battleground battle mockup' mockup/styles.css
          ! grep -Eq '\.class-(warrior|paladin|mage|priest|rogue|warlock|shaman|druid|hunter)' mockup/battle.css
          ! grep -Eq -- '--class-(warrior|paladin|mage|priest|rogue|warlock|shaman|druid|hunter):' mockup/battle.css
          ! grep -Eq '#7cb4da|#acd1e8|#d8eaf5|#eef5f8' mockup/battle.css

      - name: Start mockup server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/battle.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/battle.html >/dev/null
          for route in /mockup/battle.js /mockup/battle.css /mockup/styles.css /mockup/ui/wow-ui.css /mockup/ui/wow-icons.js /mockup/ui/wow-tooltips.js /mockup/ui/wow-nav.js; do
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise Battle HUD acceptance contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on("console", msg => { if (msg.type() === "error") errors.push("console: " + msg.text()); });
          page.on("pageerror", err => errors.push("pageerror: " + err.message));
          const assert = (condition, message) => { if (!condition) errors.push(message); };

          const response = await page.goto(base + "/mockup/battle.html", { waitUntil: "domcontentloaded" });
          assert(Boolean(response?.ok()), "Battle route did not load");
          await page.waitForSelector(".unit-frame");

          // Pause before the first scheduled turn so baseline HUD can be inspected.
          await page.locator("#pauseBattle").click();
          assert((await page.locator("#battleStatus").textContent()) === "Battle paused", "Pause control no longer pauses");
          assert((await page.locator("#pauseBattle").getAttribute("aria-pressed")) === "true", "Pause pressed state is missing");

          // Faction art and shared navigation.
          assert(await page.locator(".wow-game-shell").count() === 1, "Shared persistent navigation is missing");
          const factionImages = await page.locator(".faction-crest img").evaluateAll(nodes => nodes.map(n => n.getAttribute("src") || ""));
          assert(factionImages.length === 2 && factionImages.every(src => src.includes("wow.zamimg.com")), "Faction crests are not shared icon art");
          assert(await page.locator(".faction-crest").filter({ hasText: /^[AH]$/ }).count() === 0, "Faction letter placeholder remains");

          // Twelve Warcraft-style unit frames with separated portrait/class/action concepts.
          const frameData = await page.locator(".unit-frame").evaluateAll(nodes => nodes.map(node => ({
            className: node.className,
            portrait: node.querySelector(".unit-portrait > img")?.src || "",
            classIcon: node.querySelector(".unit-class-icon img")?.src || "",
            actionIcon: node.querySelector(".unit-action-icon img")?.src || "",
            name: node.querySelector(".combatant-name")?.textContent || "",
            meta: node.querySelector(".combatant-meta")?.textContent || "",
            health: node.querySelector(".hp-stat b")?.textContent || "",
            resource: node.querySelector(".resource-stat b")?.textContent || "",
            action: node.querySelector(".unit-action-copy strong")?.textContent || "",
            hooks: node.querySelectorAll(".unit-status-slot").length,
            classColor: getComputedStyle(node).getPropertyValue("--wow-class-color").trim()
          })));
          assert(frameData.length === 12, "Battle no longer renders twelve combatants");
          for (const unit of frameData) {
            assert(unit.portrait && unit.classIcon && unit.actionIcon, unit.name + " is missing portrait/class/action imagery");
            assert(unit.portrait !== unit.classIcon && unit.portrait !== unit.actionIcon, unit.name + " still conflates portrait and icon concepts");
            assert(Boolean(unit.meta && unit.health.includes(" / ") && unit.resource.includes(" / ")), unit.name + " unit frame metadata is incomplete");
            assert(unit.action === "Ready" && unit.hooks === 4, unit.name + " action/status hooks are incomplete");
            assert(Boolean(unit.classColor), unit.name + " is not inheriting the shared class-color source");
          }

          // Bars stay readable while paused.
          const pausedBefore = await page.evaluate(() => ({
            a: document.querySelector("#allianceHpText")?.textContent,
            h: document.querySelector("#hordeHpText")?.textContent,
            units: [...document.querySelectorAll(".unit-frame")].map(el => [
              el.querySelector(".hp-stat b")?.textContent,
              el.querySelector(".resource-stat b")?.textContent
            ])
          }));
          await page.waitForTimeout(1050);
          const pausedAfter = await page.evaluate(() => ({
            a: document.querySelector("#allianceHpText")?.textContent,
            h: document.querySelector("#hordeHpText")?.textContent,
            units: [...document.querySelectorAll(".unit-frame")].map(el => [
              el.querySelector(".hp-stat b")?.textContent,
              el.querySelector(".resource-stat b")?.textContent
            ])
          }));
          assert(JSON.stringify(pausedBefore) === JSON.stringify(pausedAfter), "Combat advanced while paused");

          // Shared speed controls preserve 1x/2x/4x behavior.
          for (const speed of [2,4,1]) {
            await page.locator('#speedButtons button[data-speed="' + speed + '"]').click();
            const selected = page.locator('#speedButtons button[data-speed="' + speed + '"]');
            assert((await selected.getAttribute("aria-pressed")) === "true", speed + "x speed did not become active");
            assert((await selected.getAttribute("class"))?.includes("is-selected"), speed + "x shared selected state is missing");
          }

          // Resume at 4x and verify real combat changes health plus surfaces the attack ability.
          await page.locator('#speedButtons button[data-speed="4"]').click();
          const teamHpBefore = (await page.locator("#allianceHpText").textContent()) + "|" + (await page.locator("#hordeHpText").textContent());
          await page.locator("#pauseBattle").click();
          assert((await page.locator("#pauseBattle").getAttribute("aria-pressed")) === "false", "Resume control did not clear pressed state");
          await page.waitForSelector(".unit-action.is-active", { timeout: 2500 });
          const activeAction = await page.locator(".unit-action.is-active").first().evaluate(el => ({
            text: el.querySelector("strong")?.textContent || "",
            icon: el.querySelector("img")?.src || ""
          }));
          assert(activeAction.text !== "Ready" && activeAction.icon.includes("wow.zamimg.com"), "Combat action is not associated with an ability icon");
          await page.waitForFunction(before => {
            const now = document.querySelector("#allianceHpText")?.textContent + "|" + document.querySelector("#hordeHpText")?.textContent;
            return now !== before;
          }, teamHpBefore, { timeout: 3000 });

          // Damage/heal/crit/action feedback hooks are present; runtime damage should appear quickly.
          await page.waitForSelector(".floating-number.damage,.floating-number.crit,.floating-number.heal", { timeout: 2500 });
          assert(await page.locator(".fx-layer").count() === 1, "Combat feedback layer is missing");

          // Presentation-only cooldown/ultimate events occur without changing the timing controls.
          await page.waitForSelector(".combat-event-tag.cooldown,.combat-event-tag.ultimate", { timeout: 4500 });
          const specialTag = await page.locator(".combat-event-tag.cooldown,.combat-event-tag.ultimate").first().textContent();
          assert(["COOLDOWN","ULTIMATE"].includes(specialTag), "Cooldown/ultimate action feedback is missing");

          // Shared unit/resource tooltips work with keyboard focus.
          await page.locator(".unit-portrait").first().focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--unit");
          let tooltipText = await page.locator(".wow-tooltip--unit").textContent();
          assert(tooltipText.includes("Health") && tooltipText.includes("Level"), "Unit shared tooltip is incomplete");
          await page.locator(".resource-stat").first().focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--resource");
          tooltipText = await page.locator(".wow-tooltip--resource").textContent();
          assert(tooltipText.includes("Current") && tooltipText.includes("Maximum"), "Resource shared tooltip is incomplete");

          // Reset restores full teams, speed and running state.
          await page.locator("#resetBattle").click();
          await page.waitForTimeout(80);
          assert((await page.locator("#battleStatus").textContent()) === "Auto battle running", "Reset did not restore running state");
          assert((await page.locator('#speedButtons button[data-speed="1"]').getAttribute("aria-pressed")) === "true", "Reset did not restore 1x speed");
          const resetBars = await page.locator(".unit-frame").evaluateAll(nodes => nodes.every(node => {
            const hp = node.querySelector(".hp-stat b")?.textContent || "";
            const [current,max] = hp.split("/").map(x => x.trim());
            return current && current === max && !node.classList.contains("defeated");
          }));
          assert(resetBars, "Reset did not restore full unit health");

          // Explicit focus rendering on shared controls.
          await page.locator("#pauseBattle").focus();
          let outline = await page.locator("#pauseBattle").evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(outline, "Pause keyboard focus is not visible");
          await page.locator('#speedButtons button[data-speed="2"]').focus();
          outline = await page.locator('#speedButtons button[data-speed="2"]').evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
          assert(outline, "Speed keyboard focus is not visible");

          // Responsive unit frames remain usable at supported widths.
          for (const viewport of [
            { width: 1180, height: 900 },
            { width: 820, height: 900 },
            { width: 520, height: 900 },
            { width: 390, height: 844 }
          ]) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(80);
            const responsive = await page.evaluate(() => {
              const shell = document.querySelector(".battle-shell")?.getBoundingClientRect();
              const arena = document.querySelector(".battle-arena")?.getBoundingClientRect();
              const frames = [...document.querySelectorAll(".unit-frame")].map(el => el.getBoundingClientRect());
              const bars = [...document.querySelectorAll(".unit-bar")].map(el => el.getBoundingClientRect());
              return {
                viewport: innerWidth,
                shellLeft: shell?.left || 0,
                shellRight: shell?.right || 0,
                arenaWidth: arena?.width || 0,
                minFrameWidth: Math.min(...frames.map(r => r.width)),
                minBarHeight: Math.min(...bars.map(r => r.height))
              };
            });
            assert(responsive.shellLeft >= -1 && responsive.shellRight <= responsive.viewport + 1, "Battle shell overflows at " + viewport.width + "px");
            assert(responsive.arenaWidth <= responsive.viewport + 1, "Battle arena overflows at " + viewport.width + "px");
            assert(responsive.minFrameWidth >= 150, "Unit frames became unreadably narrow at " + viewport.width + "px");
            assert(responsive.minBarHeight >= 16, "Health/resource bars became unreadable at " + viewport.width + "px");
          }

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log("WOWUI-008 browser acceptance contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Deterministic simulation smoke test
        run: npm run simulation:test
