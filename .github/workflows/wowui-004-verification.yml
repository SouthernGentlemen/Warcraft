name: WOWUI-004 Verification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wowui-004-verification.yml"

jobs:
  verify-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check navigation ownership and syntax
        run: |
          node --check mockup/ui/wow-nav.js
          for page in \
            mockup/index.html \
            mockup/race-selector.html \
            mockup/talent-calculator.html \
            mockup/gear.html \
            mockup/battle.html \
            mockup/base.html \
            mockup/simulation/index.html
          do
            grep -q 'class="wow-game-shell"' "$page"
            test "$(grep -o 'class="wow-game-nav__link' "$page" | wc -l)" -eq 6
            grep -q 'wow-nav.js' "$page"
          done

          ! grep -R -E 'launcher-card|launcher-grid|Open selector|Open calculator|Open simulation|Open gear|Open battle|Open base' mockup/index.html
          ! grep -R -E 'base-suite-bar|base-suite-nav|gear-suite-bar' mockup/base.html mockup/gear.html
          ! grep -R -E 'class="topbar"|battle-topbar|← Mockups' \
            mockup/race-selector.html \
            mockup/talent-calculator.html \
            mockup/battle.html \
            mockup/simulation/index.html

      - name: Start dev server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/ >/dev/null
          cat /tmp/warcraft-dev.log

      - name: Check mockup routes
        run: |
          for route in \
            /mockup/ \
            /mockup/index.html \
            /mockup/race-selector.html \
            /mockup/talent-calculator.html \
            /mockup/gear.html \
            /mockup/battle.html \
            /mockup/base.html \
            /mockup/simulation/ \
            /mockup/ui/wow-ui.css \
            /mockup/ui/wow-icons.js \
            /mockup/ui/wow-tooltips.js \
            /mockup/ui/wow-nav.js
          do
            echo "GET $route"
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install temporary browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check browser navigation contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const screens = [
            {route:"/mockup/index.html", active:"menu"},
            {route:"/mockup/race-selector.html", active:"heroes"},
            {route:"/mockup/talent-calculator.html", active:"talents"},
            {route:"/mockup/gear.html", active:"gear"},
            {route:"/mockup/battle.html", active:"battle"},
            {route:"/mockup/base.html", active:"base"},
            {route:"/mockup/simulation/", active:"simulation"}
          ];
          const destinationPaths = {
            heroes:"/mockup/race-selector.html",
            talents:"/mockup/talent-calculator.html",
            gear:"/mockup/gear.html",
            battle:"/mockup/battle.html",
            base:"/mockup/base.html",
            simulation:"/mockup/simulation/"
          };

          const browser = await chromium.launch({headless:true});
          const errors = [];

          for (const screen of screens) {
            const page = await browser.newPage({viewport:{width:1180,height:760}});
            page.on("console", message => {
              if (message.type() === "error") errors.push(`[${screen.route}] console: ${message.text()}`);
            });
            page.on("pageerror", error => errors.push(`[${screen.route}] pageerror: ${error.message}`));

            const response = await page.goto(base + screen.route, {waitUntil:"domcontentloaded"});
            if (!response || !response.ok()) errors.push(`[${screen.route}] status: ${response?.status() ?? "none"}`);
            await page.waitForTimeout(650);

            const nav = await page.evaluate(({active,destinationPaths}) => {
              const shell = document.querySelector(".wow-game-shell");
              const links = [...document.querySelectorAll(".wow-game-nav__link")];
              const current = [...document.querySelectorAll('[aria-current="page"]')];
              return {
                shell:Boolean(shell),
                sticky:shell ? getComputedStyle(shell).position : "",
                declared:shell?.dataset.wowNavActive || "",
                linkCount:links.length,
                keys:links.map(link => link.dataset.wowNavKey),
                hrefs:Object.fromEntries(links.map(link => [link.dataset.wowNavKey,new URL(link.href).pathname])),
                iconCount:links.filter(link => link.querySelector(".wow-game-nav__icon img")).length,
                activeLinks:links.filter(link => link.classList.contains("is-active")).map(link=>link.dataset.wowNavKey),
                brandActive:Boolean(document.querySelector(".wow-game-shell__brand.is-active")),
                currentCount:current.length
              };
            }, {active:screen.active,destinationPaths});

            if (!nav.shell || nav.linkCount !== 6 || nav.iconCount !== 6) errors.push(`[${screen.route}] shared nav/icon contract failed`);
            if (nav.sticky !== "sticky") errors.push(`[${screen.route}] nav is not persistent/sticky`);
            if (nav.declared !== screen.active) errors.push(`[${screen.route}] active key mismatch`);
            for (const [key,path] of Object.entries(destinationPaths)) {
              if (nav.hrefs[key] !== path) errors.push(`[${screen.route}] direct href mismatch for ${key}: ${nav.hrefs[key]}`);
            }
            if (screen.active === "menu") {
              if (!nav.brandActive || nav.activeLinks.length !== 0) errors.push("[launcher] menu active state is not obvious");
            } else if (nav.activeLinks.length !== 1 || nav.activeLinks[0] !== screen.active) {
              errors.push(`[${screen.route}] active destination state failed`);
            }

            const firstNav = page.locator(".wow-game-nav__link").first();
            await firstNav.focus();
            await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
            const tooltip = await page.evaluate(() => ({
              title:document.querySelector(".wow-tooltip__title")?.textContent.trim() || "",
              hasIcon:Boolean(document.querySelector(".wow-tooltip__icon img"))
            }));
            if (!tooltip.title || !tooltip.hasIcon) errors.push(`[${screen.route}] destination tooltip/icon failed`);

            await page.close();
          }

          const launcher = await browser.newPage({viewport:{width:1100,height:760}});
          launcher.on("console", message => {
            if (message.type() === "error") errors.push(`[launcher] console: ${message.text()}`);
          });
          launcher.on("pageerror", error => errors.push(`[launcher] pageerror: ${error.message}`));
          await launcher.goto(base + "/mockup/index.html", {waitUntil:"domcontentloaded"});
          await launcher.waitForTimeout(600);
          const launcherState = await launcher.evaluate(() => ({
            entries:document.querySelectorAll(".wow-launcher-entry").length,
            icons:document.querySelectorAll(".wow-launcher-entry__icon img").length,
            legacyCards:document.querySelectorAll(".launcher-card").length,
            paragraphs:document.querySelectorAll(".wow-launcher-entry p").length,
            openCtas:document.body.textContent.includes("Open selector") || document.body.textContent.includes("Open calculator") || document.body.textContent.includes("Open simulation")
          }));
          if (launcherState.entries !== 6 || launcherState.icons !== 6 || launcherState.legacyCards !== 0 || launcherState.paragraphs !== 0 || launcherState.openCtas) {
            errors.push("[launcher] compact game-menu acceptance failed");
          }
          await launcher.locator('.wow-launcher-entry[data-wow-nav-key="simulation"]').focus();
          const launcherTip = await launcher.locator(".wow-tooltip__title").textContent();
          if (!launcherTip.includes("Combat Simulation")) errors.push("[launcher] destination tooltip missing");
          await launcher.close();

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }

          console.log("WOWUI-004 browser navigation contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Run deterministic simulation smoke test
        run: npm run simulation:test
