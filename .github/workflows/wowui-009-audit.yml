name: WOWUI-009 Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wowui-009-audit.yml"
      - "mockup/base.html"
      - "mockup/base.js"
      - "mockup/base.css"
      - "mockup/styles.css"
      - "mockup/ui/**"

jobs:
  audit-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Source and syntax checks
        run: |
          node --check mockup/base.js
          grep -Fq 'base.css' mockup/base.html
          grep -Fq 'wow-game-shell' mockup/base.html
          grep -Fq 'base-rail-button wow-icon-button' mockup/base.html
          grep -Fq 'class="wow-select"' mockup/base.html
          grep -Fq 'building-tabs wow-tabs' mockup/base.html
          grep -Fq 'wow-button--primary' mockup/base.html
          grep -Fq 'buildingIconMarkup' mockup/base.js
          grep -Fq "costMarkup('gold'" mockup/base.js
          grep -Fq "costMarkup('lumber'" mockup/base.js
          grep -Fq "costMarkup('stone'" mockup/base.js
          ! grep -Fq 'Realm-Grinder-inspired base management mockup' mockup/styles.css
          for glyph in '🏰' '🎖' '👥' '⚔' '🎯' '📦' '⚒' '⚗' '✨' '🧵' '🛡' '⚙' '🪖' '⌂' '♞' '⌘' '⚑' '♛' '✹' '◈' '⚜' '▧' '●' '▰' '◆' '♦' '♟'; do
            ! grep -Fq "$glyph" mockup/base.html
            ! grep -Fq "$glyph" mockup/base.js
          done

      - name: Start mockup server
        run: |
          NO_OPEN=1 npm run dev > /tmp/warcraft-dev.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/mockup/base.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/mockup/base.html >/dev/null
          for route in /mockup/base.js /mockup/base.css /mockup/styles.css /mockup/ui/wow-ui.css /mockup/ui/wow-icons.js /mockup/ui/wow-tooltips.js /mockup/ui/wow-nav.js; do
            curl -fsS "http://127.0.0.1:5173$route" >/dev/null
          done

      - name: Install browser harness
        run: |
          mkdir -p /tmp/wowui-browser
          cd /tmp/wowui-browser
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise Base Management acceptance contract
        run: |
          cat > /tmp/wowui-browser/check.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = "http://127.0.0.1:5173";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on("console", msg => { if (msg.type() === "error") errors.push("console: " + msg.text()); });
          page.on("pageerror", err => errors.push("pageerror: " + err.message));
          const assert = (condition, message) => { if (!condition) errors.push(message); };

          const tooltipBoundsOK = async () => page.evaluate(() => {
            const group = document.querySelector(".wow-tooltip-group");
            if (!group) return false;
            const r = group.getBoundingClientRect();
            return r.left >= 0 && r.top >= 0 && r.right <= innerWidth + 1 && r.bottom <= innerHeight + 1;
          });

          const response = await page.goto(base + "/mockup/base.html", { waitUntil: "domcontentloaded" });
          assert(Boolean(response?.ok()), "Base route did not load");
          await page.waitForSelector(".building-row");

          // Shared navigation and Warcraft control family.
          assert(await page.locator(".wow-game-shell").count() === 1, "Shared persistent navigation is missing");
          assert((await page.locator("#buildingFilter").getAttribute("class"))?.includes("wow-select"), "Building filter is not a shared select");
          assert(await page.locator(".building-tabs.wow-tabs .wow-tab").count() === 2, "Building tabs are not shared tabs");
          assert(await page.locator(".base-action.wow-button").count() === 4, "Bottom actions are not shared WoW controls");

          // No concept glyphs remain; icons are image-driven.
          const conceptText = await page.evaluate(() => {
            const roots = document.querySelectorAll(".base-left-rail,.base-resource-bar,.base-map,.base-action-bar,.base-status-strip,.base-building-panel");
            return [...roots].map(r => r.textContent || "").join(" ");
          });
          for (const glyph of ["🏰","🎖","👥","⚔","🎯","📦","⚒","⚗","✨","🧵","🛡","⚙","🪖","⌂","♞","⌘","⚑","♛","✹","◈","⚜","▧","●","▰","◆","♦","♟"]) {
            assert(!conceptText.includes(glyph), "Legacy concept glyph remains: " + glyph);
          }

          // Icon-only left rail with shared tooltips.
          assert(await page.locator(".base-rail-button").count() === 7, "Left rail does not contain seven compact controls");
          const railMetrics = await page.locator(".base-rail-button").evaluateAll(nodes => nodes.map(el => ({
            width: el.getBoundingClientRect().width,
            height: el.getBoundingClientRect().height,
            icons: el.querySelectorAll(".wow-icon-frame img").length
          })));
          assert(railMetrics.every(x => x.width <= 64 && x.height <= 62 && x.icons === 1), "Left rail is not compact/icon-driven");
          await page.locator('.base-rail-button[data-panel="crafting"]').focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip-card");
          let tip = await page.locator(".wow-tooltip-card").textContent();
          assert(tip.includes("Crafting") && tip.includes("Profession"), "Left rail shared tooltip is incomplete");
          assert(await tooltipBoundsOK(), "Left rail tooltip escaped viewport");

          // Resource bar uses icon counters and tooltips.
          assert(await page.locator(".base-resource-counter").count() === 5, "Resource bar count changed");
          assert(await page.locator(".base-resource-counter .wow-icon-frame img").count() === 5, "Resource counters are not icon-driven");
          await page.locator('[data-resource="gold"]').focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--resource");
          tip = await page.locator(".wow-tooltip--resource").textContent();
          assert(tip.includes("Gold") && tip.includes("Current") && tip.includes("Rate"), "Gold resource tooltip is incomplete");

          // Map retains all buildings and profession coverage.
          assert(await page.locator(".base-plot").count() === 12, "Management map building coverage changed");
          assert(await page.locator(".base-plot .plot-art img").count() === 12, "Map buildings are not framed image plaques");
          for (const id of ["blacksmith","alchemy","enchanter","tailor","leather","engineer"]) {
            assert(await page.locator('.base-plot[data-building="' + id + '"] img').count() === 1, "Profession plot missing icon: " + id);
          }

          // Map selection updates right panel/list.
          await page.locator('.base-plot[data-building="alchemy"]').click();
          await page.waitForTimeout(80);
          assert(await page.locator('.base-plot[data-building="alchemy"]').getAttribute("aria-pressed") === "true", "Map selection state did not update");
          assert((await page.locator("#selectionDetail").textContent()).includes("Alchemy Lab"), "Selection detail did not follow map selection");
          assert(await page.locator('[data-building-row="alchemy"]').getAttribute("class").then(v => v.includes("selected")), "Building list selection did not follow map selection");

          // Filters preserve core/profession coverage.
          await page.selectOption("#buildingFilter", "profession");
          await page.waitForTimeout(60);
          assert(await page.locator(".building-row").count() === 6, "Profession filter no longer returns six buildings");
          const professionNames = await page.locator(".building-title strong").allTextContents();
          for (const name of ["Blacksmith","Alchemy Lab","Enchanter's Study","Tailor","Leatherworker","Engineer Workshop"]) {
            assert(professionNames.includes(name), "Profession filter is missing " + name);
          }
          await page.selectOption("#buildingFilter", "core");
          await page.waitForTimeout(60);
          assert(await page.locator(".building-row").count() === 6, "Core filter no longer returns six buildings");
          await page.selectOption("#buildingFilter", "all");
          await page.waitForTimeout(60);
          assert(await page.locator(".building-row").count() === 12, "All filter no longer restores twelve buildings");

          // Upgrade resource deduction and level/cost hooks remain unchanged.
          const beforeUpgrade = await page.evaluate(() => ({
            gold: document.querySelector("#goldValue")?.textContent,
            lumber: document.querySelector("#lumberValue")?.textContent,
            stone: document.querySelector("#stoneValue")?.textContent,
            level: document.querySelector('[data-building="keep"] .plot-label b')?.textContent
          }));
          assert(beforeUpgrade.gold === "25,430" && beforeUpgrade.lumber === "12,680" && beforeUpgrade.stone === "8,440" && beforeUpgrade.level === "10", "Initial Base resource/building values changed");

          await page.locator('[data-building-row="keep"] [data-upgrade="keep"]').click();
          await page.waitForTimeout(80);
          const afterUpgrade = await page.evaluate(() => ({
            gold: document.querySelector("#goldValue")?.textContent,
            lumber: document.querySelector("#lumberValue")?.textContent,
            stone: document.querySelector("#stoneValue")?.textContent,
            level: document.querySelector('[data-building="keep"] .plot-label b')?.textContent,
            selected: document.querySelector("#selectionDetail")?.textContent || "",
            costs: [...document.querySelectorAll('[data-building-row="keep"] .building-cost b')].map(el => el.textContent)
          }));
          assert(afterUpgrade.gold === "22,430" && afterUpgrade.lumber === "10,680" && afterUpgrade.stone === "7,940", "Upgrade resource deduction changed");
          assert(afterUpgrade.level === "11" && afterUpgrade.selected.includes("Level 11 / 20"), "Upgrade level hook changed");
          assert(afterUpgrade.costs.join(",") === "3,660,2,440,610", "Upgrade cost scaling changed");

          // Upgrade icon/cost rows and building shared tooltip.
          assert(await page.locator('[data-building-row="keep"] .building-cost-icon img').count() === 3, "Upgrade costs are not iconized");
          await page.locator('[data-building-row="keep"] .building-thumb').focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--building");
          tip = await page.locator(".wow-tooltip--building").textContent();
          assert(tip.includes("Headquarters") && tip.includes("Gold") && tip.includes("Lumber") && tip.includes("Stone"), "Building tooltip is incomplete");

          // Tabs and action hooks remain functional.
          const upgradesTab = page.locator('[data-building-tab="upgrades"]');
          await upgradesTab.click();
          assert((await upgradesTab.getAttribute("aria-selected")) === "true" && (await upgradesTab.getAttribute("class")).includes("is-selected"), "Upgrades tab selected state is broken");
          assert((await page.locator("#baseToast").textContent()).includes("Upgrade queue"), "Upgrades tab hook no longer fires");

          await page.locator('[data-action="mission"]').click();
          assert((await page.locator("#baseToast").textContent()).includes("Mission launch hook"), "Mission action hook no longer fires");
          await page.locator('[data-action="keep"]').click();
          assert((await page.locator("#selectionDetail").textContent()).includes("Headquarters"), "Upgrade Keep action no longer selects Keep");

          // Rail navigation hooks still work.
          await page.locator('.base-rail-button[data-panel="events"]').click();
          assert((await page.locator("#baseToast").textContent()).includes("Events is a navigation hook"), "Left rail navigation hook changed");

          // Currency strip is iconized and keyboard tooltips work.
          assert(await page.locator(".base-meta-stat .wow-icon-frame img").count() === 4, "Currency strip is not icon-driven");
          await page.locator('[data-currency="valor"]').focus();
          await page.waitForSelector(".wow-tooltip-layer:not([hidden]) .wow-tooltip--currency");
          tip = await page.locator(".wow-tooltip--currency").textContent();
          assert(tip.includes("Valor") && tip.includes("Current"), "Currency shared tooltip is incomplete");

          // Keyboard focus remains visible on core custom controls.
          for (const selector of ['.base-rail-button[data-panel="base"]','#buildingFilter','[data-building-tab="buildings"]','[data-action="mission"]','.base-plot[data-building="keep"]']) {
            await page.locator(selector).focus();
            const outline = await page.locator(selector).evaluate(el => getComputedStyle(el).outlineStyle !== "none" && getComputedStyle(el).outlineWidth !== "0px");
            assert(outline, "Keyboard focus is not visible for " + selector);
          }

          // Responsive layout remains usable without reverting to SaaS cards.
          for (const viewport of [
            { width: 1180, height: 900 },
            { width: 930, height: 900 },
            { width: 700, height: 900 },
            { width: 390, height: 844 }
          ]) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(80);
            const responsive = await page.evaluate(() => {
              const frame = document.querySelector(".base-game-frame")?.getBoundingClientRect();
              const map = document.querySelector(".base-map")?.getBoundingClientRect();
              const actions = [...document.querySelectorAll(".base-action")].map(el => el.getBoundingClientRect().height);
              const plots = [...document.querySelectorAll(".base-plot")].map(el => el.getBoundingClientRect());
              return {
                viewport: innerWidth,
                frameLeft: frame?.left || 0,
                frameRight: frame?.right || 0,
                mapWidth: map?.width || 0,
                minActionHeight: Math.min(...actions),
                maxPlotWidth: Math.max(...plots.map(r => r.width))
              };
            });
            assert(responsive.frameLeft >= -1 && responsive.frameRight <= responsive.viewport + 1, "Base frame overflows at " + viewport.width + "px");
            assert(responsive.mapWidth > 0, "Base map collapsed at " + viewport.width + "px");
            assert(responsive.minActionHeight >= 48, "Base actions became unusably small at " + viewport.width + "px");
            assert(responsive.maxPlotWidth <= 110, "Building plaques became oversized at " + viewport.width + "px");
          }

          await browser.close();

          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log("WOWUI-009 browser acceptance contract: clean");
          EOF
          cd /tmp/wowui-browser
          node check.mjs

      - name: Deterministic simulation smoke test
        run: npm run simulation:test
