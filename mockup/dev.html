<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Warcraft Mockup Developer Launcher</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="launcher-page">
  <header class="wow-game-shell" data-wow-nav-active="menu">
    <a class="wow-game-shell__brand" href="./base.html">
      <span class="wow-game-shell__mark">W</span>
      <span class="wow-game-shell__brand-copy"><strong>Warcraft</strong><small>Mockup Console</small></span>
    </a>
    <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
      <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
      <a class="wow-game-nav__link" data-wow-nav-key="talents" href="./talent-calculator.html">Talents</a>
      <a class="wow-game-nav__link" data-wow-nav-key="gear" href="./gear.html">Gear</a>
      <a class="wow-game-nav__link" data-wow-nav-key="battle" href="./battle.html">Battle</a>
      <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
      <a class="wow-game-nav__link" data-wow-nav-key="simulation" href="./simulation/">Simulation</a>
    </nav>
    <div class="wow-game-shell__action"></div>
  </header>
  <main class="wow-launcher-shell">
    <section class="wow-launcher-frame wow-frame">
      <header class="wow-launcher-head">
        <div>
          <span class="wow-kicker">SYSTEM REVIEW</span>
          <h1 class="wow-title">Warcraft Prototype</h1>
        </div>
        <span class="wow-launcher-head__meta">Select a system</span>
      </header>
      <nav class="wow-launcher-menu" aria-label="Warcraft prototype systems">
        <a class="wow-launcher-entry" data-wow-nav-key="heroes" href="./heroes.html">
          <span class="wow-launcher-entry__icon wow-icon-frame wow-icon-frame--md"></span>
          <span class="wow-launcher-entry__copy"><small>Heroes</small><strong>Hero Management</strong></span>
          <span class="wow-launcher-entry__chevron" aria-hidden="true">›</span>
        </a>
        <a class="wow-launcher-entry" data-wow-nav-key="journal" href="./quest-journal.html">
          <span class="wow-launcher-entry__icon wow-icon-frame wow-icon-frame--md"></span>
          <span class="wow-launcher-entry__copy"><small>Quests</small><strong>Quest Journal</strong></span>
          <span class="wow-launcher-entry__chevron" aria-hidden="true">›</span>
        </a>
        <a class="wow-launcher-entry" data-wow-nav-key="battle" href="./battle.html">
          <span class="wow-launcher-entry__icon wow-icon-frame wow-icon-frame--md"></span>
          <span class="wow-launcher-entry__copy"><small>Combat</small><strong>Battle Mockup</strong></span>
          <span class="wow-launcher-entry__chevron" aria-hidden="true">›</span>
        </a>
        <a class="wow-launcher-entry" data-wow-nav-key="base" href="./base.html">
          <span class="wow-launcher-entry__icon wow-icon-frame wow-icon-frame--md"></span>
          <span class="wow-launcher-entry__copy"><small>Stronghold</small><strong>Base Management</strong></span>
          <span class="wow-launcher-entry__chevron" aria-hidden="true">›</span>
        </a>
      </nav>
      <footer class="wow-launcher-foot">
        <span>Developer launcher</span>
        <span>Shared WoW UI layer active</span>
      </footer>
    </section>
  </main>
  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./ui/wow-nav.js"></script>
</body>
</html>
