<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Battle Mockup — Warcraft</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="battle-page">
  <main class="battle-shell">
    <div class="battle-topbar">
      <a class="battle-back" href="./index.html">← Mockups</a>
      <span class="battle-kicker">BATTLEGROUND / COMBAT REVIEW</span>
      <button id="resetBattle" class="battle-reset" type="button" data-wow-tooltip="Reset fight" data-wow-tooltip-type="Control" data-wow-tooltip-description="Restart the current prototype encounter." data-wow-tooltip-variant="control">Reset fight</button>
    </div>

    <section class="battle-frame" aria-label="Alliance versus Horde battle mockup">
      <header class="battle-hud">
        <section class="team-summary alliance-summary">
          <div class="faction-crest wow-faction-crest wow-faction-crest--alliance" aria-label="Alliance"><img data-wow-icon="faction" data-wow-key="alliance" alt=""></div>
          <div class="team-summary-copy">
            <div class="team-line">
              <div>
                <span class="team-faction">ALLIANCE</span>
                <strong>Ironforge Vanguard</strong>
              </div>
              <span id="allianceHpText" class="team-hp-text">0 / 0</span>
            </div>
            <div class="team-health"><span id="allianceHpFill"></span></div>
          </div>
        </section>

        <section class="battle-control-stack" aria-label="Battle controls">
          <div class="battle-control-row">
            <button id="pauseBattle" class="battle-control primary" type="button" aria-label="Pause battle" data-wow-tooltip="Pause or resume" data-wow-tooltip-type="Battle control" data-wow-tooltip-description="Toggle automatic combat progression." data-wow-tooltip-variant="control">Ⅱ</button>
            <button id="fastForward" class="battle-control" type="button" aria-label="Increase battle speed" data-wow-tooltip="Battle speed" data-wow-tooltip-type="Battle control" data-wow-tooltip-description="Cycle between the available combat playback speeds." data-wow-tooltip-variant="control">»</button>
          </div>
          <div id="speedButtons" class="speed-buttons" aria-label="Battle speed">
            <button class="active" type="button" data-speed="1">1×</button>
            <button type="button" data-speed="2">2×</button>
            <button type="button" data-speed="4">4×</button>
          </div>
          <div class="encounter-name">
            <span>ROUND 1</span>
            <strong>Frostbite Basin</strong>
          </div>
        </section>

        <section class="team-summary horde-summary">
          <div class="team-summary-copy">
            <div class="team-line reverse">
              <div>
                <span class="team-faction">HORDE</span>
                <strong>Frostwolf Warband</strong>
              </div>
              <span id="hordeHpText" class="team-hp-text">0 / 0</span>
            </div>
            <div class="team-health"><span id="hordeHpFill"></span></div>
          </div>
          <div class="faction-crest wow-faction-crest wow-faction-crest--horde" aria-label="Horde"><img data-wow-icon="faction" data-wow-key="horde" alt=""></div>
        </section>
      </header>

      <div class="battle-arena">
        <div class="mountain mountain-a" aria-hidden="true"></div>
        <div class="mountain mountain-b" aria-hidden="true"></div>
        <div class="mountain mountain-c" aria-hidden="true"></div>
        <div class="tree-line tree-line-back" aria-hidden="true"></div>
        <div class="tree-line tree-line-front" aria-hidden="true"></div>

        <div class="battlefield">
          <section id="allianceTeam" class="combat-team alliance-team" aria-label="Alliance heroes"></section>
          <div class="battle-center" aria-hidden="true">
            <span class="center-rune">⚔</span>
            <span class="center-line"></span>
          </div>
          <section id="hordeTeam" class="combat-team horde-team" aria-label="Horde heroes"></section>
        </div>

        <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
        <div id="resultBanner" class="result-banner" hidden></div>
      </div>

      <footer class="battle-footer">
        <div class="battle-status">
          <span class="status-dot"></span>
          <strong id="battleStatus">Auto battle running</strong>
          <span id="battleEvent">Alliance and Horde are engaging.</span>
        </div>
        <div class="battle-legend">
          <span><i class="legend-swatch hp"></i>Health</span>
          <span><i class="legend-swatch resource"></i>Resource</span>
          <span>WoW icon assets via Wowhead CDN</span>
        </div>
      </footer>
    </section>
  </main>

  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./battle.js"></script>
</body>
</html>
