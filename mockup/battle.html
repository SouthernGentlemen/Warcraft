<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Battle Mockup — Warcraft</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./battle.css">
</head>
<body class="battle-page wow-ui">
  <header class="wow-game-shell" data-wow-nav-active="battle">
    <a class="wow-game-shell__brand" href="./base.html">
      <span class="wow-game-shell__mark">W</span>
      <span class="wow-game-shell__brand-copy"><strong>Warcraft</strong><small>Mockup Console</small></span>
    </a>
    <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
      <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
      <a class="wow-game-nav__link is-active" aria-current="page" data-wow-nav-key="battle" href="./battle.html">Battle</a>
      <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
    </nav>
    <div class="wow-game-shell__action"><button id="resetBattle" class="wow-game-shell__control" type="button" data-wow-tooltip="Reset fight" data-wow-tooltip-type="Control" data-wow-tooltip-description="Restart the current deterministic encounter with the same party, NPC pool, and seed." data-wow-tooltip-variant="control">Reset</button></div>
  </header>
  <main class="battle-shell">

    <section class="battle-frame wow-frame" aria-label="Deterministic hero versus NPC battle">
      <header class="battle-hud">
        <section class="team-summary alliance-summary">
          <div class="faction-crest wow-faction-crest wow-faction-crest--alliance" aria-label="Alliance"><img data-wow-icon="faction" data-wow-key="alliance" alt=""></div>
          <div class="team-summary-copy">
            <div class="team-line">
              <div>
                <span id="allianceTeamLabel" class="team-faction">ALLIANCE</span>
                <strong id="allianceTeamName">Ironforge Vanguard</strong>
              </div>
              <span class="team-summary-status"><span id="allianceAliveText" class="team-alive-text">0 / 0 alive</span><span id="allianceHpText" class="team-hp-text">0 / 0</span></span>
            </div>
            <div class="team-health"><span id="allianceHpFill"></span></div>
          </div>
        </section>

        <section class="battle-control-stack" aria-label="Battle controls">
          <div class="battle-control-row">
            <button id="pauseBattle" class="battle-control wow-button wow-button--primary" type="button" aria-label="Pause battle" data-wow-tooltip="Pause or resume" data-wow-tooltip-type="Battle control" data-wow-tooltip-description="Toggle automatic combat progression." data-wow-tooltip-variant="control">Ⅱ</button>
            <button id="fastForward" class="battle-control wow-button" type="button" aria-label="Increase battle speed" data-wow-tooltip="Battle speed" data-wow-tooltip-type="Battle control" data-wow-tooltip-description="Cycle between the available combat playback speeds." data-wow-tooltip-variant="control">»</button>
          </div>
          <div id="speedButtons" class="speed-buttons" aria-label="Battle speed">
            <button class="wow-tab is-selected" type="button" data-speed="1" aria-pressed="true">1×</button>
            <button class="wow-tab" type="button" data-speed="2" aria-pressed="false">2×</button>
            <button class="wow-tab" type="button" data-speed="4" aria-pressed="false">4×</button>
          </div>
          <div class="encounter-name">
            <span id="battleEncounterType">ROUND 1</span>
            <strong id="battleEncounterName">Frostbite Basin</strong>
            <small id="battleEncounterParty"></small>
          </div>
        </section>

        <section class="team-summary horde-summary">
          <div class="team-summary-copy">
            <div class="team-line reverse">
              <div>
                <span id="hordeTeamLabel" class="team-faction">HORDE</span>
                <strong id="hordeTeamName">Frostwolf Warband</strong>
              </div>
              <span class="team-summary-status"><span id="hordeAliveText" class="team-alive-text">0 / 0 alive</span><span id="hordeHpText" class="team-hp-text">0 / 0</span></span>
            </div>
            <div class="team-health"><span id="hordeHpFill"></span></div>
          </div>
          <div class="faction-crest wow-faction-crest wow-faction-crest--horde" aria-label="Horde"><img data-wow-icon="faction" data-wow-key="horde" alt=""></div>
        </section>
      </header>

      <div class="battle-arena wow-inset">
        <div class="mountain mountain-a" aria-hidden="true"></div>
        <div class="mountain mountain-b" aria-hidden="true"></div>
        <div class="mountain mountain-c" aria-hidden="true"></div>
        <div class="tree-line tree-line-back" aria-hidden="true"></div>
        <div class="tree-line tree-line-front" aria-hidden="true"></div>

        <div class="battlefield">
          <section id="allianceTeam" class="combat-team alliance-team" aria-label="Alliance heroes"></section>
          <div class="battle-center" aria-hidden="true">
            <span class="center-rune wow-icon-frame wow-icon-frame--sm" aria-label="Combat"><img data-wow-icon="battle" data-wow-key="combat" alt=""></span>
            <span class="center-line"></span>
          </div>
          <section id="hordeTeam" class="combat-team horde-team" aria-label="Horde heroes"></section>
        </div>

        <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
        <div id="resultBanner" class="result-banner" hidden></div>
      </div>

      <footer class="battle-footer">
        <div class="battle-status">
          <span class="status-dot"></span>
          <strong id="battleStatus">Auto battle running</strong>
          <span id="battleEvent">Alliance and Horde are engaging.</span>
        </div>
        <div class="battle-legend">
          <span><i class="legend-swatch hp"></i>Health</span>
          <span><i class="legend-swatch resource"></i>Class resource</span>
          <span><i class="legend-swatch action"></i>Ability action</span>
        </div>
      </footer>
      <section class="battle-combat-log wow-inset" aria-label="Combat log"><div class="battle-log-head"><span class="wow-kicker">COMBAT LOG</span><small id="combatLogMeta">0 events</small></div><div class="battle-log-scroll"><table><thead><tr><th>#</th><th>Actor</th><th>Event</th><th>Detail</th><th>Target</th><th>Amount</th></tr></thead><tbody id="combatLogBody"></tbody></table></div></section>
    </section>
  </main>

  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./ui/warcraft-campaign.js"></script>\n  <script src="./ui/wow-nav.js"></script>
  <script src="./ui/warcraft-roster.js"></script>
  <script src="./battle/health-bars.js"></script>
  <script src="./battle.js"></script>
</body>
</html>
