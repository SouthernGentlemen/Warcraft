<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Race Selector — Warcraft Mockup</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="wow-game-shell" data-wow-nav-active="heroes">
    <a class="wow-game-shell__brand" href="./index.html">
      <span class="wow-game-shell__mark">W</span>
      <span class="wow-game-shell__brand-copy"><strong>Warcraft</strong><small>Mockup Console</small></span>
    </a>
    <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
      <a class="wow-game-nav__link is-active" aria-current="page" data-wow-nav-key="heroes" href="./race-selector.html">Heroes</a>
      <a class="wow-game-nav__link" data-wow-nav-key="talents" href="./talent-calculator.html">Talents</a>
      <a class="wow-game-nav__link" data-wow-nav-key="gear" href="./gear.html">Gear</a>
      <a class="wow-game-nav__link" data-wow-nav-key="battle" href="./battle.html">Battle</a>
      <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
      <a class="wow-game-nav__link" data-wow-nav-key="simulation" href="./simulation/">Simulation</a>
    </nav>
    <div class="wow-game-shell__action"></div>
  </header>
  <main class="shell">

    <header class="hero-header">
      <h1>Race Selector</h1>
      <p class="lede">Review faction presentation, Body 1 / Body 2, racial identity, and currently available classes.</p>
    </header>

    <div id="error" class="error-banner"></div>

    <section class="control-row">
      <div class="control-group">
        <span class="control-label">Faction</span>
        <div id="factionToggle" class="segmented">
          <button class="alliance active" data-faction="alliance" data-wow-tooltip="Alliance" data-wow-tooltip-type="Faction" data-wow-tooltip-description="Review Alliance races and class availability." data-wow-tooltip-variant="class-race" data-wow-tooltip-icon-category="faction" data-wow-tooltip-icon-key="alliance">Alliance</button>
          <button class="horde" data-faction="horde" data-wow-tooltip="Horde" data-wow-tooltip-type="Faction" data-wow-tooltip-description="Review Horde races and class availability." data-wow-tooltip-variant="class-race" data-wow-tooltip-icon-category="faction" data-wow-tooltip-icon-key="horde">Horde</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">Body</span>
        <div id="bodyToggle" class="segmented">
          <button class="active" data-body="body-1">Body 1 · Male</button>
          <button data-body="body-2">Body 2 · Female</button>
        </div>
      </div>
    </section>

    <section class="race-layout">
      <aside class="panel race-list" id="raceList" aria-label="Races"></aside>

      <section class="panel character-stage">
        <div id="silhouette" class="silhouette body-1" aria-hidden="true">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="legs"></div>
        </div>
        <div class="stage-label">
          <h2 id="stageRace">Human</h2>
          <p id="stageBody">Body 1 · Male</p>
        </div>
      </section>

      <aside class="panel detail">
        <p class="eyebrow" id="factionLabel">ALLIANCE</p>
        <h2 id="raceName">Human</h2>

        <h3>Racial Talent</h3>
        <div class="racial">
          <strong id="racialName">Loading…</strong>
          <div id="racialMechanic"></div>
        </div>

        <h3>Available Classes</h3>
        <div class="class-grid" id="classGrid"></div>

        <h3>Prototype Rule</h3>
        <p class="lede" id="availabilityRule" style="font-size:.9rem"></p>
      </aside>
    </section>
  </main>
  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./ui/wow-nav.js"></script>
  <script src="./race-selector.js"></script>
</body>
</html>
