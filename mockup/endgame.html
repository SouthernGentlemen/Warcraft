<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Raids & Sieges — Warcraft</title>
    <link rel="stylesheet" href="./ui/wow-ui.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./endgame.css" />
  </head>
  <body class="wow-ui endgame-page">
    <header class="wow-game-shell" data-wow-nav-active="endgame">
      <a class="wow-game-shell__brand" href="./base.html"
        ><span class="wow-game-shell__mark">W</span
        ><span class="wow-game-shell__brand-copy"
          ><strong>Warcraft</strong><small>Mockup Console</small></span
        ></a
      >
      <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
        <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
        <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
        <a
          class="wow-game-nav__link is-active"
          aria-current="page"
          data-wow-nav-key="endgame"
          href="./endgame.html"
          >Raids &amp; Sieges</a
        >
      </nav>
    </header>
    <main class="endgame-shell">
      <section class="wow-frame">
        <header class="wow-titlebar">
          <div>
            <span class="wow-kicker">ENDGAME</span>
            <h1>Raids &amp; Sieges</h1>
            <p id="endgameFaction"></p>
          </div>
        </header>
        <div id="endgameEncounters" class="endgame-grid"></div>
        <section class="endgame-preview wow-inset">
          <h2>Formation Preview</h2>
          <div id="formationPreview"></div>
        </section>
        <div class="endgame-actions">
          <button id="launchEndgame" class="wow-button wow-button--primary" type="button">
            Launch</button
          ><span id="endgameError" role="status"></span>
        </div>
      </section>
    </main>
    <script src="./ui/wow-icons.js"></script>
    <script src="./ui/wow-tooltips.js"></script>
    <script src="./ui/warcraft-campaign.js"></script>
    <script src="./ui/wow-nav.js"></script>
    <script src="./ui/warcraft-roster.js"></script>
    <script src="./endgame.js"></script>
  </body>
</html>
