<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Base — Warcraft Mockup</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./base.css">
</head>
<body class="base-page wow-ui">
  <header class="wow-game-shell" data-wow-nav-active="base">
    <a class="wow-game-shell__brand" href="./base.html">
      <span class="wow-game-shell__mark">W</span>
      <span class="wow-game-shell__brand-copy"><strong>Warcraft</strong><small>Mockup Console</small></span>
    </a>
    <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
      <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
      <a class="wow-game-nav__link" data-wow-nav-key="talents" href="./talent-calculator.html">Talents</a>
      <a class="wow-game-nav__link" data-wow-nav-key="gear" href="./gear.html">Gear</a>
      <a class="wow-game-nav__link" data-wow-nav-key="battle" href="./battle.html">Battle</a>
      <a class="wow-game-nav__link is-active" aria-current="page" data-wow-nav-key="base" href="./base.html">Base</a>
      <a class="wow-game-nav__link" data-wow-nav-key="simulation" href="./simulation/">Simulation</a>
    </nav>
    <div class="wow-game-shell__action">
      <button class="wow-game-shell__control" type="button"
        data-wow-tooltip="Settings" data-wow-tooltip-type="Control"
        data-wow-tooltip-description="Prototype settings hook." data-wow-tooltip-variant="control">Settings</button>
    </div>
  </header>

  <main class="base-shell">
    <section class="base-game-frame">
      <section class="base-main-column">
        <div class="base-resource-bar wow-inset" aria-label="Resources">
          <div class="base-resource-counter" data-resource="gold" tabindex="0">
            <span class="base-resource-icon wow-icon-frame wow-icon-frame--xs"><img data-wow-icon="currency" data-wow-key="gold" alt=""></span>
            <span class="base-resource-copy"><small>Gold</small><strong id="goldValue">25,430</strong></span>
          </div>
          <div class="base-resource-counter" data-resource="lumber" tabindex="0">
            <span class="base-resource-icon wow-icon-frame wow-icon-frame--xs"><img data-wow-icon="resource" data-wow-key="lumber" alt=""></span>
            <span class="base-resource-copy"><small>Lumber</small><strong id="lumberValue">12,680</strong></span>
          </div>
          <div class="base-resource-counter" data-resource="stone" tabindex="0">
            <span class="base-resource-icon wow-icon-frame wow-icon-frame--xs"><img data-wow-icon="resource" data-wow-key="stone" alt=""></span>
            <span class="base-resource-copy"><small>Stone</small><strong id="stoneValue">8,440</strong></span>
          </div>
        </div>

        <section class="base-map wow-inset" id="baseMap" aria-label="Base map">
          <div class="base-map-backdrop" aria-hidden="true"></div>
          <div class="base-river river-a" aria-hidden="true"></div>
          <div class="base-river river-b" aria-hidden="true"></div>
          <div class="base-road road-a" aria-hidden="true"></div>
          <div class="base-road road-b" aria-hidden="true"></div>
          <div class="base-road road-c" aria-hidden="true"></div>
          <div class="base-tree-cluster trees-a" aria-hidden="true"></div>
          <div class="base-tree-cluster trees-b" aria-hidden="true"></div>
          <div class="base-tree-cluster trees-c" aria-hidden="true"></div>

          <button class="base-plot keep" data-building="keep" style="--x:50%;--y:23%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="keep" alt=""></span>
            <span class="plot-label"><strong>Keep</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot command" data-building="command" style="--x:24%;--y:28%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="command-hall" alt=""></span>
            <span class="plot-label"><strong>Command Hall</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot recruitment" data-building="recruitment" style="--x:76%;--y:28%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="recruitment-hall" alt=""></span>
            <span class="plot-label"><strong>Recruitment Hall</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot barracks" data-building="barracks" style="--x:20%;--y:48%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="barracks" alt=""></span>
            <span class="plot-label"><strong>Barracks</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot training" data-building="training" style="--x:48%;--y:51%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="training-grounds" alt=""></span>
            <span class="plot-label"><strong>Training Grounds</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot questboard" data-building="questboard" style="--x:35%;--y:49%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="command-hall" alt=""></span>
            <span class="plot-label"><strong>Quest Board</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot storehouse" data-building="storehouse" style="--x:78%;--y:48%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="building" data-wow-key="storehouse" alt=""></span>
            <span class="plot-label"><strong>Storehouse</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot blacksmith" data-building="blacksmith" style="--x:18%;--y:69%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="blacksmithing" alt=""></span>
            <span class="plot-label"><strong>Blacksmith</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot alchemy" data-building="alchemy" style="--x:38%;--y:72%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="alchemy" alt=""></span>
            <span class="plot-label"><strong>Alchemy Lab</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot enchanter" data-building="enchanter" style="--x:56%;--y:72%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="enchanting" alt=""></span>
            <span class="plot-label"><strong>Enchanter's Study</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot tailor" data-building="tailor" style="--x:72%;--y:66%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="tailoring" alt=""></span>
            <span class="plot-label"><strong>Tailor</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot leather" data-building="leather" style="--x:69%;--y:82%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="leatherworking" alt=""></span>
            <span class="plot-label"><strong>Leatherworker</strong><small>Lv. <b>1</b></small></span>
          </button>
          <button class="base-plot engineer" data-building="engineer" style="--x:86%;--y:68%">
            <span class="plot-art wow-icon-frame"><img data-wow-icon="profession" data-wow-key="engineering" alt=""></span>
            <span class="plot-label"><strong>Engineer Workshop</strong><small>Lv. <b>1</b></small></span>
          </button>

          <div class="base-map-caption wow-frame">
            <span class="base-map-caption__crest wow-faction-crest"><img id="baseFactionCrest" alt=""></span>
            <span class="base-map-caption__copy"><strong id="baseStrongholdName">Stronghold</strong><small id="baseStrongholdSubtitle">Persistent base</small></span>
          </div>
        </section>

      </section>

      <aside id="baseSidecar" class="base-sidecar wow-frame" role="dialog" aria-modal="false" aria-labelledby="baseSidecarTitle" hidden>
        <header class="base-sidecar__header wow-titlebar">
          <div class="base-sidecar__identity">
            <div id="baseSidecarIcon" class="base-sidecar__icon" aria-hidden="true"></div>
            <div>
              <span id="baseSidecarCategory" class="wow-kicker">BUILDING</span>
              <h2 id="baseSidecarTitle">Building</h2>
              <small id="baseSidecarLevel">Level 1 / 5</small>
            </div>
          </div>
          <button id="baseSidecarClose" class="base-sidecar__close wow-button" type="button" aria-label="Close building details">×</button>
        </header>
        <div id="baseSidecarBody" class="base-sidecar__body"></div>
      </aside>

    </section>

    <div class="base-toast" id="baseToast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./ui/wow-nav.js"></script>
  <script src="./ui/warcraft-roster.js"></script>
  <script src="./base.js"></script>
</body>
</html>
