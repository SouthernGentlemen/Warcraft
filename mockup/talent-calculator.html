<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Talent Calculator — Warcraft Mockup</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="talent-page">
  <main class="talent-shell">
    <div class="wow-topline">
      <a class="back" href="./index.html">← Mockups</a>
      <div class="wow-title-block">
        <span class="eyebrow">CLASS TALENTS</span>
        <h1>Talent Calculator</h1>
      </div>
      <div class="wow-controls">
        <label class="wow-field">
          <span>Class</span>
          <select id="classSelect"></select>
        </label>
        <label class="wow-field wow-level-field">
          <span>Hero Level <strong id="levelBadge">5</strong></span>
          <input id="levelRange" type="range" min="1" max="5" step="1" value="5">
        </label>
        <button class="wow-reset" id="resetBuild">Reset</button>
      </div>
    </div>

    <div id="error" class="error-banner"></div>

    <div class="wow-build-strip">
      <div>
        <strong id="pointsUsed">0 / 5</strong>
        <span>Talent Points</span>
      </div>
      <p id="buildStatus">Choose a Tier 1 talent to select a specialization.</p>
      <p class="wow-click-help">Left click to learn · Right click to unlearn</p>
    </div>

    <section id="wowTreeBoard" class="wow-tree-board" aria-label="Talent trees"></section>

    <p class="wow-attribution">
      Talent icon art is loaded from Wowhead's WoW icon CDN for prototype review.
    </p>
  </main>

  <div id="talentTooltip" class="wow-tooltip" hidden></div>
  <script src="./ui/wow-icons.js"></script>
  <script src="./talent-calculator.js"></script>
</body>
</html>
