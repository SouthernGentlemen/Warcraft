<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quest Journal — Warcraft Mockup</title>
    <link rel="stylesheet" href="./ui/wow-ui.css" />
    <link rel="stylesheet" href="./quest-journal.css" />
  </head>
  <body class="quest-journal-page wow-ui">
    <header class="wow-game-shell">
      <a class="wow-game-shell__brand" href="./base.html">
        <span class="wow-game-shell__mark">W</span>
        <span class="wow-game-shell__brand-copy"
          ><strong>Warcraft</strong><small>Mockup Console</small></span
        >
      </a>
      <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
        <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
        <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
        <a class="wow-game-nav__link" data-wow-nav-key="endgame" href="./endgame.html"
          >Raids &amp; Sieges</a
        >
      </nav>
      <div class="wow-game-shell__action">
        <a class="wow-button quest-journal__base-link" href="./base.html">Return to Base</a>
      </div>
    </header>

    <main class="quest-journal-shell">
      <section class="quest-journal wow-frame" aria-labelledby="questJournalTitle">
        <header class="quest-journal__header wow-titlebar">
          <div class="quest-journal__identity">
            <span class="quest-journal__icon wow-icon-frame wow-icon-frame--lg">
              <img data-wow-icon="quest" data-wow-key="journal" alt="" />
            </span>
            <div>
              <span class="wow-kicker">QUEST LOG</span>
              <h1 id="questJournalTitle">Quest Journal</h1>
              <p>Quest Board assignments mirrored from your current roster state.</p>
            </div>
          </div>
          <span id="questJournalFaction" class="quest-journal__faction">Alliance</span>
        </header>

        <div class="quest-journal__summary" aria-label="Quest status summary">
          <div><span>Available</span><strong id="availableQuestCount">0</strong></div>
          <div><span>Active</span><strong id="activeQuestCount">0</strong></div>
          <div><span>Completed</span><strong id="completedQuestCount">0</strong></div>
        </div>

        <div class="quest-journal__columns">
          <section class="quest-journal__section" aria-labelledby="availableQuestHeading">
            <header>
              <span class="wow-icon-frame wow-icon-frame--xs"
                ><img data-wow-icon="quest" data-wow-key="available" alt=""
              /></span>
              <div>
                <span class="wow-label">AVAILABLE</span>
                <h2 id="availableQuestHeading">Available / Accepted</h2>
              </div>
            </header>
            <div id="availableQuestList" class="quest-journal__list"></div>
          </section>

          <section class="quest-journal__section" aria-labelledby="activeQuestHeading">
            <header>
              <span class="wow-icon-frame wow-icon-frame--xs"
                ><img data-wow-icon="quest" data-wow-key="active" alt=""
              /></span>
              <div>
                <span class="wow-label">DISPATCHED</span>
                <h2 id="activeQuestHeading">Active Quests</h2>
              </div>
            </header>
            <div id="activeQuestList" class="quest-journal__list"></div>
          </section>

          <section class="quest-journal__section" aria-labelledby="completedQuestHeading">
            <header>
              <span class="wow-icon-frame wow-icon-frame--xs"
                ><img data-wow-icon="quest" data-wow-key="completed" alt=""
              /></span>
              <div>
                <span class="wow-label">HISTORY</span>
                <h2 id="completedQuestHeading">Completed Quests</h2>
              </div>
            </header>
            <div id="completedQuestList" class="quest-journal__list"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="./ui/wow-icons.js"></script>
    <script src="./ui/wow-tooltips.js"></script>
    <script src="./ui/warcraft-campaign.js"></script>
    <script src="./ui/wow-nav.js"></script>
    <script src="./ui/warcraft-roster.js"></script>
    <script src="./quest-journal.js"></script>
  </body>
</html>
