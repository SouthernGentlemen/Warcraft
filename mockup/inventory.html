<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventory — Warcraft Mockup</title>
  <link rel="stylesheet" href="./ui/wow-ui.css">
  <link rel="stylesheet" href="./inventory.css">
</head>
<body class="inventory-page wow-ui">
  <header class="wow-game-shell">
    <a class="wow-game-shell__brand" href="./base.html">
      <span class="wow-game-shell__mark">W</span>
      <span class="wow-game-shell__brand-copy"><strong>Warcraft</strong><small>Mockup Console</small></span>
    </a>
    <nav class="wow-game-nav" aria-label="Warcraft mockup screens">
      <a class="wow-game-nav__link" data-wow-nav-key="heroes" href="./heroes.html">Heroes</a>
      <a class="wow-game-nav__link" data-wow-nav-key="battle" href="./battle.html">Battle</a>
      <a class="wow-game-nav__link" data-wow-nav-key="base" href="./base.html">Base</a>
    </nav>
    <div class="wow-game-shell__action">
      <a class="wow-button inventory__base-link" href="./base.html">Return to Base</a>
    </div>
  </header>

  <main class="inventory-shell">
    <section class="inventory-frame wow-frame" aria-labelledby="inventoryTitle">
      <header class="inventory-header wow-titlebar">
        <div class="inventory-header__identity">
          <span class="inventory-header__icon wow-icon-frame wow-icon-frame--lg">
            <img data-wow-icon="equipment-slot" data-wow-key="chest" alt="">
          </span>
          <div>
            <span class="wow-kicker">GLOBAL INVENTORY</span>
            <h1 id="inventoryTitle">Inventory</h1>
            <p>Owned equipment across the entire roster. Equipping remains a hero-management action.</p>
          </div>
        </div>
        <div class="inventory-header__count"><strong id="inventoryCount">0</strong><small>Owned Items</small></div>
      </header>

      <div class="inventory-toolbar">
        <label>
          <span class="wow-label">Slot</span>
          <select id="inventorySlotFilter" class="wow-select">
            <option value="all">All Slots</option>
          </select>
        </label>
        <label>
          <span class="wow-label">Tier</span>
          <select id="inventoryTierFilter" class="wow-select">
            <option value="all">All Tiers</option>
            <option value="1">Tier 1</option>
            <option value="2">Tier 2</option>
            <option value="3">Tier 3</option>
            <option value="4">Tier 4</option>
            <option value="5">Tier 5</option>
          </select>
        </label>
        <label class="inventory-search">
          <span class="wow-label">Search</span>
          <input id="inventorySearch" class="wow-input" type="search" placeholder="Item name or family">
        </label>
        <label class="inventory-checkbox wow-checkbox">
          <input id="inventoryUnequippedOnly" type="checkbox">
          <span>Unequipped only</span>
        </label>
      </div>

      <div class="inventory-status">
        <span id="inventorySummary">0 items</span>
        <span>Hover or focus an item for details</span>
      </div>

      <div id="inventoryGrid" class="inventory-grid" aria-live="polite"></div>
      <div id="inventoryEmpty" class="inventory-empty" hidden>
        <span class="wow-kicker">EMPTY</span>
        <p>No owned items match the current filters.</p>
      </div>
    </section>
  </main>

  <script src="./ui/wow-icons.js"></script>
  <script src="./ui/wow-tooltips.js"></script>
  <script src="./ui/warcraft-campaign.js"></script>\n  <script src="./ui/wow-nav.js"></script>
  <script src="./ui/warcraft-roster.js"></script>
  <script src="./ui/warcraft-equipment-rules.js"></script>
  <script src="./ui/warcraft-equipment.js"></script>
  <script src="./inventory.js"></script>
</body>
</html>
